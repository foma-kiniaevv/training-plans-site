<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d6b79'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='21' font-weight='700' text-anchor='middle' fill='%23fff'%3E%D0%91%3C/text%3E%3C/svg%3E">

<style>
/* Layout: plan catalog in the athlete-diary manner. Plan chips → phase strip → week pills → sticky day tabs → collapsible sections; the main-work card is dark and carries the athlete's entries. */
:root{
  --card:#141414; --card-ink:#ffffff; --card-muted:#9a9aa0; --card-line:#2c2c2e;
  --bg:#ffffff; --sunk:#f1f1f2; --ink:#141414; --muted:#86868b; --soft:#c7c7cc; --line:#e5e5e7;
  --accent:#c2611f; --done:#141414; --good:#2f8f5b;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0c0d; --sunk:#1c1c1e; --ink:#f2f2f3; --muted:#8e8e93; --soft:#48484a; --line:#2a2a2d;
  --accent:#e8873f; --done:#f2f2f3; --good:#4cc283; --card:#1c1c1e; --card-line:#2f2f33; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0c0d; --sunk:#1c1c1e; --ink:#f2f2f3; --muted:#8e8e93; --soft:#48484a; --line:#2a2a2d;
  --accent:#e8873f; --done:#f2f2f3; --good:#4cc283; --card:#1c1c1e; --card-line:#2f2f33; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-direction:column;gap:4px}
.eyebrow{color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.eyebrow button{border:0;background:none;color:var(--accent);font:500 14px var(--sans);cursor:pointer;padding:0}
h1{font-family:var(--display);font-size:28px;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:400}
h1 b{font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-18px;padding-inline:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 14px var(--sans);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.about{display:flex;flex-direction:column;gap:6px}
.about .who{font-size:15px}
.about .freq{font-size:13px;color:var(--muted)}
.strip{display:flex;gap:3px;height:28px}
.strip button{border:0;border-radius:6px;background:var(--sunk);color:var(--muted);font:500 11px var(--sans);cursor:pointer;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 6px}
.strip button.on{background:var(--accent);color:#fff}
.weekline{display:flex;flex-direction:column;gap:8px}
.weeks{display:flex;gap:5px;flex-wrap:wrap}
.wk{border:1px solid var(--line);background:var(--bg);color:var(--muted);font:500 13px var(--sans);min-width:34px;padding:5px 9px;border-radius:999px;cursor:pointer;font-variant-numeric:tabular-nums}
.wk.has{color:var(--ink)}
.wk[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.focus{font-size:14px;color:var(--muted)}
.focus b{color:var(--ink);font-weight:600}

.seg{display:grid;gap:2px;align-items:stretch;background:var(--sunk);border-radius:14px;padding:3px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 0 0 8px var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.seg button{border:0;background:transparent;color:var(--muted);font:500 12px var(--sans);padding:8px 2px 7px;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;min-width:0}
.seg button small{font-size:11.5px;hyphens:auto;-webkit-hyphens:auto;font-weight:600;line-height:1.2;color:var(--ink);text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.seg .off{display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--soft)}
.seg button[aria-selected="false"] small{color:var(--muted);font-weight:500}
.seg button .ok{color:var(--good)}
.seg .bar{display:block;width:60%;height:3px;border-radius:2px;margin-top:auto;background:var(--line)}
.seg .bar.part{background:linear-gradient(90deg,var(--accent) var(--p),var(--line) var(--p))}
.seg .bar.full{background:var(--good)}
.seg button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.dayhead{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.dayhead .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:700}
.dayhead .sum{font-size:17px;color:var(--muted);font-variant-numeric:tabular-nums}
.dayhead .sum b{color:var(--accent);font-weight:600}
.progress{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.progress.full{color:var(--good)}
#day{display:flex;flex-direction:column;gap:6px}
details.sec{border-bottom:1px solid var(--line)}
details.sec > summary{list-style:none;cursor:pointer;padding:13px 0;display:flex;align-items:center;gap:10px}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary h3{flex:1;min-width:0;margin:0;font-size:16px;font-weight:600}
h3 small{font-weight:400;color:var(--soft);margin-left:5px;font-size:14px;font-variant-numeric:tabular-nums}
h3 small.ok{color:var(--good)}
.chev{width:13px;height:13px;flex:none;color:var(--muted);transition:transform .2s}
details.sec[open] .chev{transform:rotate(90deg)}
details.sec > .inner{padding-bottom:16px;display:flex;flex-direction:column;gap:10px}
.meta{font-size:13px;color:var(--muted);text-align:right;max-width:46%}

.list{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:22px 1fr auto;gap:14px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.list > .item:first-child{border-top:0}
.item > input{width:20px;height:20px;margin:0;accent-color:var(--done);cursor:pointer}
.txt{min-width:0;display:flex;flex-direction:column}
.item label{min-width:0;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.item .n{font-weight:500}
.item .d{font-size:14px;color:var(--accent);font-variant-numeric:tabular-nums}
.item .h{font-size:13px;color:var(--muted)}
.item.done .n,.item.done .d{color:var(--muted)}
.item.done .n{text-decoration:line-through;text-decoration-color:var(--soft)}
.vid{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);color:var(--muted);text-decoration:none;flex:none}
.vid:hover{color:var(--ink);border-color:var(--soft)}
.vid svg{width:8px;height:8px;fill:currentColor;margin-left:1px}
.grp{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:16px 0 4px}
.list > .grp:first-child{border-top:0;padding-top:0}
.grp + .item{border-top:0}
.wts{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,58px));gap:6px;margin-top:6px}
.wts input,.times input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 4px;font:400 14px var(--sans);text-align:center;font-variant-numeric:tabular-nums}

.kpi{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.kpi.hero{background:var(--card);color:var(--card-ink);border-color:var(--card)}
.kpi.hero .cell{border-color:var(--card-line)}
.kpi.hero .lbl,.kpi.hero .was{color:var(--card-muted)}
.kpi.hero .tbtn{background:transparent;color:var(--card-ink);border-color:var(--card-line)}
.kpi.hero .tbtn.on{background:var(--card-ink);color:var(--card)}
.kpi.hero .times input,.kpi.hero .wts input{background:transparent;color:var(--card-ink);border-color:var(--card-line)}
.kpi.hero .times label{color:var(--card-muted)}
.prev{font-size:13px;color:var(--card-muted);font-variant-numeric:tabular-nums}
.prev b{color:var(--card-ink);font-weight:600}
.cell{padding:13px 15px;display:flex;flex-direction:column;gap:5px;min-width:0;border-top:1px solid var(--line)}
.cell:first-child{border-top:0}
.cell.wide{grid-column:1/-1}
.cell.l{border-right:1px solid var(--line)}
.lbl{font-size:13px}
.val{font-family:var(--display);font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:700;font-variant-numeric:tabular-nums}
.val.light{font-weight:300}
.kpi.hero .cell:not(.wide) .val:not([data-out]){font-size:17px;font-weight:600;letter-spacing:0;line-height:1.25}
.kpi.hero .cell:not(.wide) .val.light:not([data-out]){font-weight:400}
.kpi.hero .val[data-out]{font-size:26px}
.was{font-size:13px;color:var(--muted)}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tbtn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 12px;font:500 13px var(--sans);cursor:pointer}
.tbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.times{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.times label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.times input{padding:9px 4px;font-size:16px}

.rest{padding-block:24px;display:flex;flex-direction:column;gap:4px}
.empty{padding-block:30px;color:var(--muted)}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 16px var(--sans)}
.field textarea{min-height:72px;resize:vertical}
.savebar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13px;padding:7px 14px;border-radius:999px;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.savebar.show{opacity:.92}
.note{font-size:13px;color:var(--muted)}
.phd{font-size:14px;color:var(--ink);margin-bottom:4px}
.goal{font-size:14px;color:var(--muted);line-height:1.45}
table.dose{min-width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
table.dose th,table.dose td{border-bottom:1px solid var(--line);padding:6px 6px 6px 0;text-align:left;vertical-align:top}
table.dose th{color:var(--muted);font-weight:500}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.src{font-size:12px;color:var(--muted)}
/* library */
.lib{display:flex;flex-direction:column;gap:4px}
.lib .item{grid-template-columns:1fr auto}
.lib .uses{font-size:12px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:400 16px var(--sans)}
@media (max-width:420px){h1{font-size:26px}.val{font-size:26px}}
@media (prefers-reduced-motion:reduce){.chev,.savebar{transition:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<style>
/* Дизайн-система AL Leone, связка «Залив + Ночь» (claude.ai/artifact/HpsP3UNzJYzCUSz1XukX4j, tokens.json).
   Шрифт сайта остаётся прежним (Montserrat): гарнитуры Unbounded/Onest из системы сознательно не подключаем.
   Подключается первым на всех страницах; старые имена переменных в storefront, learn и cabinet ссылаются сюда. */
:root{
  --ds-bg:#f5f1ea; --ds-surface:#fffcf7; --ds-surface-2:#ebe5da; --ds-line:#dad2c4;
  --ds-ink:#1b201e; --ds-ink-2:#525853; --ds-ink-3:#878a84;
  --ds-brand:#1d6b79; --ds-brand-strong:#124650; --ds-brand-soft:#d9e8e5; --ds-on-brand:#ffffff;
  --ds-accent:#b0473a; --ds-accent-ink:#9a3c30; --ds-accent-soft:#f3ddd7; --ds-on-accent:#ffffff;
  --ds-deep:#15333a; --ds-on-deep:#ffffff; --ds-up:#1d7348; --ds-down:#b8322a;
  --ds-shadow-card:0 0 0 1px rgba(24,32,31,.09),0 1px 2px rgba(24,32,31,.04); --ds-shadow-pop:0 8px 24px rgba(24,32,31,.12);
  /* шкала фаз программы: светлее → темнее */
  --ds-ph1:#d9e8e5; --ds-ph2:#7fb0b8; --ds-ph3:#1d6b79; --ds-ph4:#15333a;
  --ds-r-sm:6px; --ds-r-md:12px; --ds-r-lg:18px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ds-bg:#18191a; --ds-surface:#212224; --ds-surface-2:#2b2d2f; --ds-line:#3a3d40;
  --ds-ink:#f2f1ee; --ds-ink-2:#b4b5b3; --ds-ink-3:#878a8b;
  --ds-brand:#5bb5c2; --ds-brand-strong:#a3dbe2; --ds-brand-soft:#1f3a3f; --ds-on-brand:#0b1a1d;
  --ds-accent:#b0473a; --ds-accent-ink:#e8917f; --ds-accent-soft:#3d2622; --ds-on-accent:#ffffff;
  --ds-deep:#2c4448; --ds-on-deep:#ffffff; --ds-up:#57c48f; --ds-down:#ff7a6b;
  --ds-shadow-card:0 0 0 1px rgba(255,255,255,.06); --ds-shadow-pop:0 8px 24px rgba(0,0,0,.5);
  --ds-ph1:#1f3a3f; --ds-ph2:#2f6770; --ds-ph3:#5bb5c2; --ds-ph4:#a3dbe2; color-scheme:dark}}
:root[data-theme="dark"]{
  --ds-bg:#18191a; --ds-surface:#212224; --ds-surface-2:#2b2d2f; --ds-line:#3a3d40;
  --ds-ink:#f2f1ee; --ds-ink-2:#b4b5b3; --ds-ink-3:#878a8b;
  --ds-brand:#5bb5c2; --ds-brand-strong:#a3dbe2; --ds-brand-soft:#1f3a3f; --ds-on-brand:#0b1a1d;
  --ds-accent:#b0473a; --ds-accent-ink:#e8917f; --ds-accent-soft:#3d2622; --ds-on-accent:#ffffff;
  --ds-deep:#2c4448; --ds-on-deep:#ffffff; --ds-up:#57c48f; --ds-down:#ff7a6b;
  --ds-shadow-card:0 0 0 1px rgba(255,255,255,.06); --ds-shadow-pop:0 8px 24px rgba(0,0,0,.5);
  --ds-ph1:#1f3a3f; --ds-ph2:#2f6770; --ds-ph3:#5bb5c2; --ds-ph4:#a3dbe2; color-scheme:dark}
/* Кабинет по дизайн-системе AL Leone (src/al-leone.css): панель deep слева, плитки с тонкой линией, кирпичный только для текущего места. Поверх стилей template.html. */
:root{
  --bg:var(--ds-bg); --panel:var(--ds-surface); --sunk:var(--ds-surface-2); --night:var(--ds-deep); --on-night:var(--ds-on-deep); --on-night-muted:rgba(255,255,255,.74); --night-line:rgba(255,255,255,.14);
  --ink:var(--ds-ink); --muted:var(--ds-ink-2); --soft:var(--ds-ink-3); --line:var(--ds-line);
  --accent:var(--ds-brand-strong); --brand:var(--ds-brand); --brand-soft:var(--ds-brand-soft); --on-brand:var(--ds-on-brand); --done:var(--ds-ink); --good:var(--ds-up); --ok-soft:var(--ds-brand-soft);
  --card:var(--ds-deep); --card-ink:var(--ds-on-deep); --card-muted:rgba(255,255,255,.74); --card-line:rgba(255,255,255,.14);
  --shadow-card:var(--ds-shadow-card);
  --sans:"Montserrat","Helvetica Neue",Arial,sans-serif; --display:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
body{font-size:15px;line-height:22px}

/* панель */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--night);color:var(--on-night);padding:20px 16px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{font-size:13px;line-height:18px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;color:inherit;padding-inline:10px}
.side .slogan{display:block;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-muted);margin-top:6px}
.topnav{display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:18px;font-weight:500;margin-top:auto;border-top:1px solid var(--card-line);padding-top:12px}
.topnav a,.topnav button{background:none;border:0;padding:8px 10px;color:var(--on-night);cursor:pointer;text-decoration:none;font:inherit;text-align:left;border-radius:8px}
.topnav a:hover,.topnav button:hover{background:var(--card-line)}
.side .chips{display:flex;flex-direction:column;gap:2px;overflow:visible;margin:0;padding:0}
.side .chip{border:0;background:none;color:var(--on-night-muted);font:500 13px/18px var(--sans);padding:8px 10px;border-radius:8px;text-align:left;flex:none}
.side .chip:hover{background:var(--card-line);color:var(--on-night)}
.side .chip[aria-pressed="true"]{background:var(--ds-accent);color:var(--ds-on-accent);font-weight:600}
#plans:empty{display:none}
#plans:has(.chip:only-child){display:none}

/* основная часть */
.wrap{max-width:820px;width:100%;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:32px 56px;gap:14px;min-width:0}
h1{font-size:40px;line-height:44px;letter-spacing:0;font-weight:700}
h1 b{font-weight:700}
#planview{display:flex;flex-direction:column;gap:12px}
.about,.weekline,.form,.rest,.empty,#day > .note,#day details.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--ds-r-lg);box-shadow:var(--shadow-card)}
.about{padding:20px;gap:12px}
.about .who{font-size:15px;line-height:22px;color:var(--muted)}
.about .spec{margin:0;display:grid;border-top:1px solid var(--line)}
.about .spec div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;padding-block:9px;border-bottom:1px solid var(--line)}
.about .spec dt{font-size:13px;line-height:18px;color:var(--muted)}
.about .spec dd{margin:0;font-size:15px;line-height:22px;font-weight:500}
.about details.sec:last-child{border-bottom:0}
.about details.sec > summary{padding:11px 0}
.about details.sec > summary h3{font-size:15px;font-weight:600}

/* фазы и недели */
.weekline{padding:20px;gap:12px;margin-top:0!important}
.strip{height:28px;gap:2px;background:var(--sunk);border-radius:8px;padding:2px}
.strip button{border-radius:6px;background:none;color:var(--muted);font:500 11px var(--sans)}
.strip button.on{background:var(--panel);color:var(--ink);font-weight:600;box-shadow:var(--shadow-card)}
.weeks{gap:4px}
.wk{background:var(--panel);font:500 13px var(--sans);min-width:34px;padding:4px 8px}
.wk.has{color:var(--ink);border-color:var(--soft)}
.wk[aria-pressed="true"]{background:var(--brand-soft);color:var(--accent);border-color:var(--brand-soft);font-weight:600}
.focus{font-size:13px;line-height:18px}
.phd{font-size:13px;line-height:18px;color:var(--muted)}

/* дни */
.seg{background:var(--sunk);border-radius:14px;box-shadow:0 0 0 6px var(--bg)}
.seg button{border-radius:11px;font:500 12px var(--sans)}
.seg button small{font-size:11px}
.seg button[aria-selected="true"]{background:var(--panel)}
.seg .bar.part{background:linear-gradient(90deg,var(--brand) var(--p),var(--line) var(--p))}
.dayhead{padding-top:10px;gap:4px}
.dayhead h2{font-size:24px;line-height:30px;font-weight:600;letter-spacing:0}
.dayhead .sum{font-size:15px;line-height:22px}
.dayhead .sum b{color:var(--ink)}
.goal{font-size:15px;line-height:22px}
.progress{font-size:13px;line-height:18px;background:var(--sunk);border-radius:999px;padding:3px 10px;font-weight:500}
.progress.full{background:var(--ok-soft);color:var(--good)}
.progress.full::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:2px}

/* секции */
#day{gap:8px}
#day details.sec{padding-inline:20px}
details.sec > summary h3{font-size:18px;line-height:24px;font-weight:600}
h3 small{color:var(--muted);font-size:13px}
.meta{font-size:13px;line-height:18px}
.item .n{font-size:15px;line-height:22px}
.item .d{font-size:13px;line-height:18px;color:var(--ink)}
.item .h{line-height:18px}
.item > input{accent-color:var(--brand)}
.vid{background:var(--panel)}
.vid:hover{color:var(--accent);border-color:var(--accent)}
.wts input,.times input,.field input,.field textarea,.search{background:var(--panel);border-radius:8px}
.grp{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.14em}

/* основная работа */
.kpi{border-radius:14px}
.val{font-size:34px;line-height:38px;font-weight:700;letter-spacing:0}
.kpi.hero .cell:not(.wide) .val:not([data-out]){font-size:15px;line-height:22px;font-weight:600}
.kpi.hero .val[data-out]{font-size:24px;line-height:30px}
.kpi.hero .times input,.kpi.hero .wts input{background:transparent}
.lbl{font-size:13px;line-height:18px}
.tbtn{background:var(--panel);font:600 13px var(--sans);padding:6px 14px}
.tbtn.on{background:var(--ink);color:var(--panel)}
.kpi.hero .tbtn{background:transparent}

/* вход и состояния */
.form{padding:20px}
details.sec .form{background:none;border:0;border-radius:0;box-shadow:none;padding:0}
#login,#openlib{justify-self:start;background:var(--brand);color:var(--on-brand);border:0;font:600 13px var(--sans);padding:12px 26px}
#login:hover{filter:brightness(1.05)}
#login:disabled{opacity:.6}
#day > .note{padding:18px;font-size:15px;line-height:22px}
.rest,.empty{padding:18px}
.note{font-size:13px;line-height:18px}
.note a{color:var(--accent)}
.lib{gap:8px}
.lib > .note{padding-inline:2px}
.search{border-color:var(--line)}
.savebar{border-radius:999px}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);min-height:0}
  .side{position:static;height:auto;padding:14px 16px;gap:12px}
  .side .brand{padding-inline:0}
  .side .chips{flex-direction:row;overflow-x:auto;margin-inline:-16px;padding-inline:16px;scrollbar-width:none}
  .side .chip{white-space:nowrap}
  .topnav{flex-direction:row;flex-wrap:wrap;gap:4px 14px;margin-top:0;border-top:0;padding-top:0}
  .topnav a,.topnav button{padding:4px 0}
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
  h1{font-size:30px;line-height:34px}
  .about .spec div{grid-template-columns:110px minmax(0,1fr)}
}

/* кабинет без назначенной программы: обучение, программы, библиотека */
.dash{display:grid;gap:12px}
.dash .form,.form{display:grid;gap:10px;padding:20px}
.form h3{margin:0;font-size:18px;line-height:24px;font-weight:600}
.form p{margin:0}
a.tbtn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;justify-self:start;background:var(--brand);color:var(--on-brand);border:0;font:600 13px/18px var(--sans);padding:12px 22px;border-radius:var(--ds-r-md);min-height:44px}
.link{color:var(--ds-brand-strong);font-weight:600}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><a class="brand" href="../">Больше чем качалка<span class="slogan">Личный кабинет</span></a><div class="chips" id="plans" role="group" aria-label="Планы"></div><nav class="topnav" aria-label="Кабинет"><a href="../learn/">Моё обучение</a><button type="button" id="libbtn">Библиотека</button><a href="../programs/">Все программы</a><a href="../admin/" id="adminlink" hidden>Кабинет владельца</a><button type="button" id="logout" hidden>Выйти</button></nav></aside>
<div class="wrap">
  <header>
    <h1 id="ptitle"></h1>
  </header>
  <div id="planview">
    <div class="about" id="about"></div>
    <div class="weekline" style="margin-top:16px"><div class="strip" id="strip"></div><div class="weeks" id="weeks"></div><div class="focus" id="focus"></div></div>
  </div>
  <nav class="seg" lang="ru" role="tablist" aria-label="Дни недели" id="days"></nav>
  <div class="dayhead" id="dayhead"></div>
  <main id="day"></main>
</div>
</div>
<div class="savebar" id="savebar" role="status"></div>

<script>
const EX = {};
let PLANS = [];
</script>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = s => Math.floor(s/60) + ":" + String(s%60).padStart(2,"0");
const play = '<svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 1l7 4-7 4z"/></svg>';
const chev = '<svg class="chev" viewBox="0 0 14 14" aria-hidden="true"><path d="M5 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ls = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

let plan = null, WEEKS = {}, CP = {}, me = null, isStaff = false;
let wIdx = 0, dIdx = null, view = "plan", timers = {}, cache = {};
let db = null, canWrite = true, logs = {}, loaded = false;
const weekOf = (p, w) => (WEEKS[p.id] && WEEKS[p.id][w]) || { phase: "", focus: "Неделя загружается…", days: Array(7).fill({ rest: true, label: "—" }) };
const dayId = (w, d) => `${CP[plan.id] || plan.id}-${w+1}-${d+1}`;
function rowsOf(s){ return (s.rows || []).concat(...(s.groups || []).map(g => g.rows)); }
function ids(day){ day.sections.forEach((s,si) => rowsOf(s).forEach((r,ri) => r.id ||= `${si}-${ri}-${r.k}`)); return day; }

/* ---------- log state with autosave ---------- */
const local = {}, pending = {}, inflight = {};
function logOf(id){ if (!local[id]) local[id] = JSON.parse(JSON.stringify(logs[id] || {done:{},times:[],weights:{},feel:"",note:""})); local[id].weights ||= {}; local[id].times ||= []; return local[id]; }
function toast(t){ const b = document.getElementById("savebar"); b.textContent = t; b.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => b.classList.remove("show"), 1600); }
function touch(id){ clearTimeout(pending[id]); pending[id] = setTimeout(() => flush(id), 700); }
async function flush(id){
  if (!db || !canWrite || !CP[plan.id]) return;
  if (inflight[id]) await inflight[id];
  const body = Object.assign({}, logOf(id), { updatedAt: new Date().toISOString() });
  delete pending[id];
  const [cp, wk, dy] = id.split("-").map(Number);
  inflight[id] = sb.from("program_log").upsert({ client_program_id: cp, week_no: wk, day_no: dy, data: body }).then(({ error }) => {
    if (error) { toast(error.code === "42501" ? "Нет прав на запись" : "Не сохранилось, проверьте связь"); return; }
    logs[id] = body; toast("Сохранено");
  }).finally(() => { inflight[id] = null; });
  await inflight[id];
}
function countDone(day, id){ const L = logOf(id); let all = 0, done = 0; day.sections.forEach(s => rowsOf(s).forEach(r => { all++; if (L.done[r.id]) done++; })); return [done, all]; }

/* ---------- rendering ---------- */
function wtsHtml(id, key, n, label){
  const L = logOf(id), dis = canWrite ? "" : " disabled";
  return `<div class="wts">${Array.from({length:n}, (_,s) => `<input data-w="${esc(key)}" data-s="${s}" inputmode="decimal" placeholder="${s+1}: кг" value="${esc((L.weights[key]||[])[s]||"")}" aria-label="${esc(label)}, подход ${s+1}, кг"${dis}>`).join("")}</div>`;
}
function itemHtml(id, r){
  const L = logOf(id), on = !!L.done[r.id], cid = `c-${id}-${r.id}`;
  return `<li class="item${on ? " done" : ""}">
    <input type="checkbox" id="${cid}" data-k="${esc(r.id)}"${on ? " checked" : ""}${canWrite ? "" : " disabled"} aria-label="Сделано: ${esc(r.n)}">
    <div class="txt"><label for="${cid}"><span class="n">${esc(r.n)}</span>${r.d ? `<span class="d">${esc(r.d)}</span>` : ""}${r.h ? `<span class="h">${esc(r.h)}</span>` : ""}</label>${r.w ? wtsHtml(id, r.id, r.w, r.n) : ""}</div>
    ${r.v ? `<a class="vid" href="${esc(r.v)}" target="_blank" rel="noopener" aria-label="Видео: ${esc(r.n)}" title="Видео техники">${play}</a>` : "<span></span>"}
  </li>`;
}
const timerHtml = (tid, secs) => `<div class="val" data-out="${tid}">${fmt(secs)}</div><div class="tbtns"><button class="tbtn" type="button" data-tstart="${tid}" data-secs="${secs}">Старт</button><button class="tbtn" type="button" data-treset="${tid}">Сброс</button></div>`;
function prevResult(m){
  for (let w = wIdx - 1; w >= 0; w--) { const wk = weekOf(plan, w);
    for (let d = 0; d < wk.days.length; d++) { const day = wk.days[d]; if (day.rest) continue;
      const ms = day.sections.find(s => s.main && s.main.kind === m.kind); if (!ms) continue;
      const L = logs[dayId(w, d)] || {};
      const t = (L.times || []).filter(x => x !== "" && x != null), k = ((L.weights || {}).main || []).filter(x => x !== "" && x != null);
      if (t.length || k.length) return { w, big: ms.main.big, vals: t.length ? t : k, unit: t.length ? "с" : "кг" }; } }
  return null;
}
function mainHtml(id, m){
  const L = logOf(id), dis = canWrite ? "" : " disabled";
  const cells = (m.cells || []).map((c,ci) => `<div class="cell${ci === 0 ? " l" : ""}"><div class="lbl">${esc(c.lbl)}</div>${c.timer ? timerHtml("rest", c.timer) : `<div class="val${c.light ? " light" : ""}">${esc(c.val)}</div>`}</div>`).join("");
  const pv = prevResult(m), prev = pv ? `<div class="prev">Неделя ${pv.w+1}, ${esc(pv.big)}: <b>${pv.vals.map(esc).join(" · ")} ${pv.unit}</b></div>` : "";
  const times = m.times ? `<div class="cell wide"><div class="lbl">Время, с</div>${prev}<div class="times">${Array.from({length:m.times}, (_,i) => `<label>${i+1}-й<input data-t="${i}" inputmode="decimal" value="${esc(L.times[i]||"")}"${dis}></label>`).join("")}</div></div>` : "";
  const sets = m.sets ? `<div class="cell wide"><div class="lbl">Вес по подходам</div>${prev}${wtsHtml(id, "main", m.sets, m.kind)}</div>` : "";
  return `<div class="kpi hero"><div class="cell wide"><div class="lbl">${esc(m.kind)}</div><div class="val">${esc(m.big)}</div></div>${cells}${times}${sets}</div>`;
}
function isOpen(key, def){ const v = ls.get("open:" + key); return v === null ? def : v === "1"; }
function sec(key, def, head, body){ return `<details class="sec" data-sec="${key}"${isOpen(key, def) ? " open" : ""}><summary>${chev}${head}</summary><div class="inner">${body}</div></details>`; }
function sectionHtml(id, s, i){
  if (s.gap) return `<div class="kpi" style="margin-block:8px;border-style:dashed"><div class="cell wide"><div class="lbl">${esc(s.gap)}</div>${s.timer ? timerHtml("gap"+i, s.timer) : ""}</div></div>`;
  const L = logOf(id), rows = rowsOf(s), done = rows.filter(r => L.done[r.id]).length;
  let body;
  if (s.main) body = mainHtml(id, s.main);
  else if (s.groups) body = `<ul class="list">${s.groups.map(g => `<li class="grp">${esc(g.t)}</li>` + g.rows.map(r => itemHtml(id, r)).join("")).join("")}</ul>`;
  else body = `<ul class="list">${rows.map(r => itemHtml(id, r)).join("")}</ul>`;
  if (s.note) body = `<div class="note">${esc(s.note)}</div>` + body;
  const cnt = rows.length ? `<small class="${done === rows.length ? "ok" : ""}">${done}/${rows.length}</small>` : "";
  return sec(`${plan.id}-${i}-${s.t}`, !!s.main, `<h3>${esc(s.t)}${cnt}</h3><span class="meta">${esc(s.meta || "")}</span>`, body);
}
function reportHtml(id){
  const L = logOf(id), dis = canWrite ? "" : " disabled";
  return sec(`report`, false, `<h3>Самочувствие и комментарий</h3>`, `<div class="form">
    <div class="field"><label for="r-feel">Самочувствие</label><input id="r-feel" value="${esc(L.feel)}"${dis}></div>
    <div class="field"><label for="r-note">Комментарий</label><textarea id="r-note"${dis}>${esc(L.note)}</textarea></div>
    ${logs[id] && logs[id].updatedAt ? `<div class="note">Последнее изменение: ${new Date(logs[id].updatedAt).toLocaleString("ru-RU",{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"})}</div>` : ""}
    ${CP[plan.id] ? "" : `<div class="note">Просмотр программы: дневник ведёт клиент, которому она назначена.</div>`}
  </div>`);
}
function doseHtml(d){
  return (d.text ? `<div class="note">${esc(d.text)}</div>` : "") + (d.table ? `<div style="overflow-x:auto;margin-inline:-18px;padding-inline:18px"><table class="dose"><thead><tr>${d.table[0].map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${d.table.slice(1).map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>` : "");
}
function phaseOf(w){ return plan.phases.findIndex(ph => w + 1 >= ph.w[0] && w + 1 <= ph.w[1]); }

function render(){
  Object.values(timers).forEach(t => clearInterval(t.h)); timers = {};
  document.getElementById("libbtn").textContent = view === "lib" ? "← К планам" : "Библиотека";
  if ((!plan && view !== "lib") || (view === "lib" && !LIB)) { renderGate(); return; }
  document.getElementById("planview").hidden = false; document.getElementById("days").hidden = false;
  const P = document.getElementById("plans"), D = document.getElementById("days"), H = document.getElementById("dayhead"), Mn = document.getElementById("day");
  P.innerHTML = PLANS.map(p => `<button class="chip" type="button" data-plan="${p.id}" aria-pressed="${view === "plan" && p.id === plan.id}">${esc(p.short)}</button>`).join("");
  document.getElementById("libbtn").textContent = view === "lib" ? "← К планам" : "Библиотека";
  if (view === "lib") { document.getElementById("planview").hidden = true; D.hidden = true; H.innerHTML = ""; document.getElementById("ptitle").innerHTML = "<b>Библиотека</b> упражнений"; Mn.innerHTML = libHtml(); bindLib(); return; }
  document.getElementById("planview").hidden = false; D.hidden = false;
  document.getElementById("ptitle").innerHTML = esc(plan.title).replace(/^([^:]+)/, "<b>$1</b>");
  document.getElementById("about").innerHTML = `<div class="who">${esc(plan.intro || plan.who)}</div><dl class="spec"><div><dt>Срок</dt><dd>${plan.weeks} нед</dd></div><div><dt>Занятий в неделю</dt><dd>${esc(plan.freq)}</dd></div><div><dt>Для кого</dt><dd>${esc(plan.who)}</dd></div></dl>` +
    (plan.load ? sec(`${plan.id}-load`, false, `<h3>Содержание нагрузки</h3>`, `<ul class="rules">${plan.load.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`) : "") +
    (plan.dose ? sec(`${plan.id}-dose`, false, `<h3>Как дозировать</h3>`, doseHtml(plan.dose)) : "") +
    (plan.edits && isStaff ? sec(`${plan.id}-edits`, false, `<h3>Правки и дополнения<small>${plan.edits.length}</small></h3>`, `<ul class="rules">${plan.edits.map(r => `<li>${esc(r)}</li>`).join("")}</ul><div class="note" style="margin-top:6px">«Правка» — где логичнее поправить исходный план; «(+)» — добавлено к авторской схеме.</div>`) : "") +
    sec(`${plan.id}-rules`, false, `<h3>Принципы плана</h3>`, `<ol class="rules">${plan.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ol>${isStaff && plan.check ? `<div class="note" style="margin-top:8px"><b>Сверка с общепринятым:</b> ${esc(plan.check)}</div>` : ""}${isStaff ? `<div class="src">Источники: ${esc(plan.sources)}</div>` : ""}`);
  const ph = phaseOf(wIdx);
  document.getElementById("strip").innerHTML = plan.phases.map((p,i) => `<button type="button" data-phase="${i}" class="${i === ph ? "on" : ""}" style="flex:${p.w[1]-p.w[0]+1}" title="${esc(p.t)}, недели ${p.w[0]}–${p.w[1]}">${esc(p.t)}</button>`).join("");
  document.getElementById("weeks").innerHTML = Array.from({length: plan.weeks}, (_,w) => { const has = weekOf(plan, w).days.some((d,i) => logs[dayId(w, i)]);
    return `<button class="wk${has ? " has" : ""}" type="button" data-week="${w}" aria-pressed="${w === wIdx}" aria-label="Неделя ${w+1}">${w+1}</button>`; }).join("");
  const wk = weekOf(plan, wIdx);
  const phd = ph >= 0 && plan.phases[ph].d ? `<div class="phd">${esc(plan.phases[ph].d)}</div>` : "";
  document.getElementById("focus").innerHTML = phd + `<b>Неделя ${wIdx+1} · ${esc(wk.phase)}.</b> ${esc(wk.focus)}`;
  const act = wk.days.map((d,i) => d.rest ? -1 : i).filter(i => i >= 0);
  if (dIdx === null || !act.includes(dIdx)) dIdx = act[0];
  D.style.gridTemplateColumns = wk.days.map(d => d.rest ? "20px" : "minmax(0,1fr)").join(" ");
  D.innerHTML = wk.days.map((d,i) => { if (d.rest) return `<span class="off" aria-label="День ${i+1}: ${esc(d.label)}">${esc(d.label)}</span>`;
    ids(d); const [dn, all] = countDone(d, dayId(wIdx, i)), full = all && dn === all, bar = full ? "full" : dn ? "part" : "";
    return `<button role="tab" type="button" data-day="${i}" aria-selected="${i === dIdx}">День ${i+1}<small class="${full ? "ok" : ""}">${full ? "✓ " : ""}${esc(d.title)}</small><span class="bar ${bar}" style="--p:${all ? Math.round(dn/all*100) : 0}%"></span></button>`; }).join("");
  const day = ids(wk.days[dIdx]), id = dayId(wIdx, dIdx), [dn, all] = countDone(day, id);
  const ms = day.sections.find(s => s.main);
  H.innerHTML = `<div class="top"><h2>${esc(day.title)}</h2>${all ? `<span class="progress${dn === all ? " full" : ""}">${dn === all ? "Выполнено" : `Отмечено ${dn} из ${all}`}</span>` : ""}</div>${ms ? `<div class="sum">${esc(ms.main.kind)}: <b>${esc(ms.main.big)}</b></div>` : ""}${day.goal ? `<div class="goal">${esc(day.goal)}</div>` : ""}`;
  Mn.innerHTML = day.sections.map((s,i) => sectionHtml(id, s, i)).join("") + reportHtml(id);
  bind(day, id);
}

function refreshCounts(day, id){
  const L = logOf(id), [dn, all] = countDone(day, id);
  const p = document.querySelector("#dayhead .progress"); if (p) { p.textContent = dn === all ? "Выполнено" : `Отмечено ${dn} из ${all}`; p.classList.toggle("full", dn === all); }
  document.querySelectorAll("#day details.sec").forEach(el => { const i = +el.dataset.sec.split("-")[1]; const s = day.sections[i]; if (!s || el.dataset.sec === "report") return;
    const rows = rowsOf(s), done = rows.filter(r => L.done[r.id]).length, sm = el.querySelector("h3 small");
    if (sm) { sm.textContent = `${done}/${rows.length}`; sm.classList.toggle("ok", done === rows.length); } });
  const tab = document.querySelector(`#days [data-day="${dIdx}"]`);
  if (tab) { tab.querySelector("small").textContent = (all && dn === all ? "✓ " : "") + day.title; const bar = tab.querySelector(".bar"); bar.className = "bar " + (all && dn === all ? "full" : dn ? "part" : ""); bar.style.setProperty("--p", (all ? Math.round(dn/all*100) : 0) + "%"); }
}
function bind(day, id){
  const L = logOf(id);
  document.querySelectorAll("#day .item > input[type=checkbox]").forEach(cb => cb.addEventListener("change", () => {
    if (cb.checked) L.done[cb.dataset.k] = true; else delete L.done[cb.dataset.k];
    cb.closest(".item").classList.toggle("done", cb.checked); refreshCounts(day, id); touch(id); }));
  document.querySelectorAll("#day [data-w]").forEach(i => i.addEventListener("input", () => {
    const a = L.weights[i.dataset.w] ||= []; a[+i.dataset.s] = i.value.trim().replace(",", "."); for (let k = 0; k < a.length; k++) if (a[k] == null) a[k] = ""; touch(id); }));
  document.querySelectorAll("#day [data-t]").forEach(i => i.addEventListener("input", () => {
    L.times[+i.dataset.t] = i.value.trim().replace(",", "."); for (let k = 0; k < L.times.length; k++) if (L.times[k] == null) L.times[k] = ""; touch(id); }));
  const f = document.getElementById("r-feel"), n = document.getElementById("r-note");
  if (f) f.addEventListener("input", () => { L.feel = f.value; touch(id); });
  if (n) n.addEventListener("input", () => { L.note = n.value; touch(id); });
  document.querySelectorAll("details.sec").forEach(d => d.addEventListener("toggle", () => ls.set("open:" + d.dataset.sec, d.open ? "1" : "0")));
  document.querySelectorAll("[data-tstart]").forEach(b => {
    const tid = b.dataset.tstart, secs = +b.dataset.secs, out = document.querySelector(`[data-out="${tid}"]`);
    timers[tid] = { left: secs, h: null };
    b.addEventListener("click", () => { const t = timers[tid];
      if (t.h) { clearInterval(t.h); t.h = null; b.textContent = "Продолжить"; b.classList.remove("on"); return; }
      if (t.left <= 0) t.left = secs; b.textContent = "Пауза"; b.classList.add("on");
      t.h = setInterval(() => { t.left--; out.textContent = fmt(Math.max(t.left,0)); if (t.left <= 0) { clearInterval(t.h); t.h = null; b.textContent = "Ещё раз"; b.classList.remove("on"); } }, 1000); });
    document.querySelector(`[data-treset="${tid}"]`).addEventListener("click", () => { const t = timers[tid]; clearInterval(t.h); t.h = null; t.left = secs; out.textContent = fmt(secs); b.textContent = "Старт"; b.classList.remove("on"); });
  });
}

/* ---------- library: every exercise, its video, and where the plans put it ---------- */
let USES = null, libQ = "";
function buildUses(){
  USES = {};
  PLANS.forEach(p => { for (let w = 0; w < p.weeks; w++) weekOf(p, w).days.forEach(d => { if (d.rest) return; d.sections.forEach(s => rowsOf(s).forEach(r => {
    const u = (USES[r.k] ||= {}); (u[p.short] ||= new Set()).add(s.t); })); }); });
}
function libHtml(){
  buildUses();
  const cats = {}; Object.entries(EX).sort((a,b) => (a[1].c.startsWith("Бег")) - (b[1].c.startsWith("Бег"))).forEach(([k,e]) => (cats[e.c] ||= []).push([k,e]));
  const q = libQ.toLowerCase(), withV = Object.values(EX).filter(e => e.v).length;
  const body = Object.entries(cats).map(([c, list]) => {
    const rows = list.filter(([k,e]) => !q || e.n.toLowerCase().includes(q)).map(([k,e]) => { const u = USES[k];
      const uses = u ? Object.entries(u).map(([p, s]) => `${p}: ${[...s].join(", ")}`).join(" · ") : "";
      return `<li class="item"><div class="txt"><span class="n">${esc(e.n)}</span><span class="uses">${esc(uses)}</span></div>${e.v ? `<a class="vid" href="${esc(e.v)}" target="_blank" rel="noopener" aria-label="Видео: ${esc(e.n)}">${play}</a>` : "<span></span>"}</li>`; }).join("");
    return rows ? sec("lib-" + c, true, `<h3>${esc(c)}<small>${list.length}</small></h3>`, `<ul class="list">${rows}</ul>`) : ""; }).join("");
  return `<div class="lib"><div class="note">${Object.keys(EX).length} упражнений, у ${withV} есть видео техники с Google Диска. Категория говорит, в какое место занятия упражнение уместно ставить.</div>
    <input class="search" id="libq" type="search" placeholder="Найти упражнение" value="${esc(libQ)}" aria-label="Поиск упражнения">${body}</div>`;
}
