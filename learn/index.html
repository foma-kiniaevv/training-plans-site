<style>/* Дизайн-система «Больше чем качалка» (claude.ai/artifact/RzNZbZFbooDDb1qJhgsHrD, tokens.json): светлая и «Сланец».
   Цвет в две роли: малина = «где ты» (шкала s1–s5: этап, тип дня, текущее место), голубой = «что делать» (ссылки, инструкция).
   Нейтральный холодный холст, белые карточки отделяются тоном, без рамок и теней. Главная кнопка графитовая.
   Подключается первым на всех страницах. Имена --ds-* сохранены, чтобы стили страниц не переписывать:
   --ds-brand = главная кнопка, --ds-brand-strong = ссылка, --ds-accent = малина «где ты». */
:root{
  /* нейтральные */
  --ds-bg:#CED6DD; --ds-surface:#FFFFFF; --ds-surface-2:#EEF1F4; --ds-line:#C9D1D8; --ds-ctrl:#66717D; --ds-rest:#E3E8EC;
  --ds-ink:#20252B; --ds-ink-2:#535E69; --ds-ink-3:#7D8894;
  /* главная кнопка и ссылки */
  --ds-brand:#20252B; --ds-on-brand:#FFFFFF; --ds-brand-strong:#2F567B; --ds-brand-soft:#EBF0F6;
  --ds-info:#5F8DB8; --ds-instr-k:#2F567B;
  /* малина: шкала s1–s5 и текст на ней */
  --ds-s1:#F4E1E8; --ds-s2:#E9BFCF; --ds-s3:#D995AF; --ds-s4:#CA7196; --ds-s5:#A5466D; --ds-on-s:#0E1521;
  --ds-accent:#E9BFCF; --ds-on-accent:#0E1521; --ds-accent-ink:#A5466D; --ds-accent-soft:#F4E1E8;
  /* тёмная плашка (основная работа в дневнике, шапка кабинета владельца): графит, как главная кнопка */
  --ds-deep:#20252B; --ds-on-deep:#FFFFFF;
  /* статусы: в системе их нет, оставлены прежние значения, всегда со словом или значком */
  --ds-up:#1d7348; --ds-down:#b8322a;
  --ds-shadow-card:none; --ds-shadow-pop:0 8px 24px rgba(14,21,33,.14);
  --ds-ph1:#F4E1E8; --ds-ph2:#E9BFCF; --ds-ph3:#D995AF; --ds-ph4:#CA7196;
  --ds-on-s4:#0E1521;
  --ds-r-xs:4px; --ds-r-sm:8px; --ds-r-md:10px; --ds-r-lg:14px;
  /* переход малина → голубой: только полоса под превью на главной */
  --ds-g1:#E9BFCF; --ds-g2:#BBD3EA; --ds-band-end:#A9C4DE;
  --ds-link-line:color-mix(in srgb, var(--ds-brand-strong) 35%, transparent);
  /* вторичная кнопка и фон ссылки при наведении: ink 7 % */
  --ds-btn2:color-mix(in srgb, var(--ds-ink) 7%, transparent);
  --ds-sans:"Inter","Inter Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}
/* тёмная тема «Сланец»: серый между графитом и сланцем, синева только намёком */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ds-bg:#131619; --ds-surface:#22252B; --ds-surface-2:#1A1D21; --ds-line:#2F3239; --ds-ctrl:#6C7179; --ds-rest:#1E2125;
  --ds-ink:#F2F4F7; --ds-ink-2:#A8ADB5; --ds-ink-3:#6C7179;
  --ds-brand:#F2F4F7; --ds-on-brand:#131619; --ds-brand-strong:#99C3E6; --ds-brand-soft:#1D2128;
  --ds-info:#99C3E6; --ds-instr-k:#A8ADB5;
  --ds-s1:#4A2A3A; --ds-s2:#6E3A54; --ds-s3:#9C5276; --ds-s4:#D57FA2; --ds-s5:#F0B3CB; --ds-on-s:#FFFFFF;
  --ds-accent:#6E3A54; --ds-on-accent:#FFFFFF; --ds-accent-ink:#F0B3CB; --ds-accent-soft:#4A2A3A;
  --ds-deep:#1A1D21; --ds-on-deep:#F2F4F7;
  --ds-up:#57c48f; --ds-down:#ff7a6b;
  --ds-shadow-pop:0 8px 24px rgba(0,0,0,.5);
  --ds-ph1:#4A2A3A; --ds-ph2:#6E3A54; --ds-ph3:#9C5276; --ds-ph4:#D57FA2; --ds-g1:#6E3A54; --ds-g2:#374859; --ds-band-end:#374859; --ds-on-s4:#131619; color-scheme:dark}}
:root[data-theme="dark"]{
  --ds-bg:#131619; --ds-surface:#22252B; --ds-surface-2:#1A1D21; --ds-line:#2F3239; --ds-ctrl:#6C7179; --ds-rest:#1E2125;
  --ds-ink:#F2F4F7; --ds-ink-2:#A8ADB5; --ds-ink-3:#6C7179;
  --ds-brand:#F2F4F7; --ds-on-brand:#131619; --ds-brand-strong:#99C3E6; --ds-brand-soft:#1D2128;
  --ds-info:#99C3E6; --ds-instr-k:#A8ADB5;
  --ds-s1:#4A2A3A; --ds-s2:#6E3A54; --ds-s3:#9C5276; --ds-s4:#D57FA2; --ds-s5:#F0B3CB; --ds-on-s:#FFFFFF;
  --ds-accent:#6E3A54; --ds-on-accent:#FFFFFF; --ds-accent-ink:#F0B3CB; --ds-accent-soft:#4A2A3A;
  --ds-deep:#1A1D21; --ds-on-deep:#F2F4F7;
  --ds-up:#57c48f; --ds-down:#ff7a6b;
  --ds-shadow-pop:0 8px 24px rgba(0,0,0,.5);
  --ds-ph1:#4A2A3A; --ds-ph2:#6E3A54; --ds-ph3:#9C5276; --ds-ph4:#D57FA2; --ds-g1:#6E3A54; --ds-g2:#374859; --ds-band-end:#374859; --ds-on-s4:#131619; color-scheme:dark}

/* Шрифт: одна гарнитура Inter; заголовки 800 с отрицательным трекингом, цифры табличные */
body{font-family:var(--ds-sans)}
h1{letter-spacing:-0.04em}
h2,h3{letter-spacing:-0.02em}
.num, td, .stat b, .phases span{font-variant-numeric:tabular-nums}

/* Ссылки (правила L1–L2). Ссылки интерфейса без подчёркивания: место, вес, цвет, фон при наведении.
   Ссылка внутри предложения: цвет и тонкая полупрозрачная линия, при наведении линия полная. */
a{text-decoration:none}
:is(p, small, .note, .lead) a:not(.btn):not(.tbtn):not(.vid){color:var(--ds-brand-strong);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--ds-link-line)}
:is(p, small, .note, .lead) a:not(.btn):not(.tbtn):not(.vid):hover{text-decoration-color:currentColor}
:where(a, button, summary, [role="button"]){cursor:pointer}
:where(a, button, summary, input, select, textarea, video):focus-visible{outline:2px solid var(--ds-ink);outline-offset:2px}
/* флажки и плеер видео: браузер не всегда считает их фокус «видимым», поэтому обводка по обычному фокусу */
input[type="checkbox"]:focus, input[type="radio"]:focus, input[type="date"]:focus-within, video:focus-within{outline:2px solid var(--ds-ink);outline-offset:2px}
/* ссылка «К содержанию»: видна только при фокусе с клавиатуры (2.4.1) */
.skip{position:absolute;left:-9999px;top:8px}
.skip:focus{left:16px;z-index:40;min-height:32px;display:inline-flex;align-items:center;background:var(--ds-surface);color:var(--ds-ink);padding:8px 12px;border-radius:var(--ds-r-sm)}

/* Знак: контур названия, цвет ink в обеих темах */
.wordmark{display:block;height:20px;width:auto;color:var(--ds-ink)}

/* Текст только для экранных дикторов */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* E2: заготовка загрузки той же формы, что контент: заголовок, карточка, строка; без анимации */
.skel{display:grid;gap:12px;padding-block:16px}
.skel i{display:block;height:16px;border-radius:var(--ds-r-sm);background:var(--ds-surface-2)}
.skel i:nth-of-type(1){width:40%;height:32px}
.skel i:nth-of-type(2){height:120px;border-radius:var(--ds-r-lg)}
.skel i:nth-of-type(3){width:70%}
/* DD2, DD9: выпадающий список как остальные поля, один шеврон 16 px цвета вторичного текста */
select:not([multiple]){appearance:none;-webkit-appearance:none;padding-right:36px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%206l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23535E69%22%20stroke-width%3D%221.75%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) select:not([multiple]){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%206l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23A8ADB5%22%20stroke-width%3D%221.75%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E")}}
:root[data-theme="dark"] select:not([multiple]){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%206l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23A8ADB5%22%20stroke-width%3D%221.75%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E")}

/* переключатель темы: значок 20 px цвета текста, нажатое состояние = тёмная тема включена */
.theme-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;border-radius:var(--ds-r-sm);padding:10px;min-height:44px;min-width:44px;justify-content:center}
.theme-btn:hover{background:var(--ds-btn2)}
.theme-btn .ico{width:20px;height:20px;flex:none}
.theme-btn[aria-pressed="true"] .ico path{fill:currentColor}
/* Раздел «Обучение». Токены «Больше чем качалка» (src/bchk.css): светлая панель слева, белые плитки без рамок, малина только для текущего места. */
:root{
  --surface:var(--ds-bg); --raised:var(--ds-surface); --sunken:var(--ds-surface-2); --night:var(--ds-surface-2); --on-night:var(--ds-ink); --on-night-muted:var(--ds-ink-2); --night-line:var(--ds-rest);
  --ink:var(--ds-ink); --muted:var(--ds-ink-2); --soft:var(--ds-ink-3); --line:var(--ds-line); --brand:var(--ds-brand); --brand-strong:var(--ds-brand-strong); --brand-soft:var(--ds-brand-soft); --on-brand:var(--ds-on-brand);
  --accent:var(--ds-accent); --accent-ink:var(--ds-accent-ink); --on-accent:var(--ds-on-accent);
  --good:var(--ds-up); --good-soft:var(--ds-brand-soft); --bad:var(--ds-down); --bad-soft:var(--ds-accent-soft);
  --shadow-card:none; /* B1: статичные плитки отделяет одна рамка, тени только у всплывающего */
  --r-sm:var(--ds-r-sm); --r-md:var(--ds-r-md); --r-lg:var(--ds-r-lg);
  --sans:var(--ds-sans);
}
*{box-sizing:border-box}
html{scroll-padding-top:16px}
body{margin:0;background:var(--surface);color:var(--ink);font:400 15px/24px var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

/* каркас */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{background:var(--night);color:var(--on-night);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand .wordmark{height:17px}
.brand{display:block;font-size:16px;line-height:20px;padding-block:2px;font-weight:800;letter-spacing:-0.02em;text-decoration:none;padding-inline:10px}
.brand span{display:block;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-night-muted);margin-top:6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--on-night-muted);padding:12px 10px 6px}
.nav a{display:flex;gap:8px;align-items:baseline;padding:8px 10px;border-radius:var(--r-sm);text-decoration:none;color:var(--on-night-muted);font-size:13px;line-height:18px;font-weight:500}
.nav a:hover{background:var(--night-line);color:var(--on-night)}
.nav a[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.nav a.mod{color:var(--on-night);font-weight:600}
.nav a.ch{padding-left:16px}
.nav a .n{flex:none;width:20px;font-variant-numeric:tabular-nums;opacity:.7}
.nav a .ok{margin-left:auto;flex:none}
.foot{margin-top:auto;border-top:1px solid var(--night-line);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.foot a,.foot button{background:none;border:0;padding:8px 10px;border-radius:var(--r-sm);text-align:left;text-decoration:none;color:var(--on-night);font-size:13px;line-height:18px;font-weight:500}
.foot a:hover,.foot button:hover{background:var(--night-line)}
.foot .who{font-size:12px;line-height:16px;color:var(--on-night-muted);padding:4px 10px;overflow-wrap:anywhere}
.mbar{display:none}
.main{min-width:0;padding:32px max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px))}
.page{max-width:860px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}

/* общие элементы */
.eyebrow{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2, var(--muted))}
.head{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.head h1{font-size:40px;line-height:44px;font-weight:800}
.lead{color:var(--muted);max-width:40em}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;line-height:18px;color:var(--muted)}
.tile{background:var(--raised);border:1px solid transparent;border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--brand);color:var(--on-brand);font-size:13px;line-height:18px;font-weight:600;padding:12px 24px;border-radius:999px;border:0;text-decoration:none;text-align:center}
.btn:hover{filter:brightness(1.05)}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.ghost{background:var(--ds-btn2);color:var(--ink);border:0}
.btn.ghost:hover{border-color:var(--soft)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13px;line-height:18px;color:var(--muted)}
.note a,.link{color:var(--brand-strong);font-weight:600}
.link{background:none;border:0;padding:0;font-size:inherit}
.link:hover{color:var(--ink)}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:13px;line-height:18px;font-weight:500;color:var(--muted);text-decoration:none}
.chip:hover{border-color:var(--soft)}
.chip[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--raised)}

/* вход и доступ */
.gate{display:flex;flex-direction:column;gap:14px;max-width:560px}
.gate h2{font-size:24px;line-height:30px;font-weight:600}
.gate form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.gate .fld{flex:1 1 220px;min-width:0;display:grid;gap:4px;font-size:13px;line-height:18px;color:var(--muted)}
.gate input{width:100%;min-width:0;min-height:44px;font:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.gate .ok{color:var(--good);font-weight:500}
.gate .err{color:var(--bad);font-weight:500}
.status{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.status b{font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;line-height:18px;font-weight:500;background:var(--sunken);color:var(--muted)}
.pill.on{background:var(--good-soft);color:var(--good)}

/* модули и главы */
.mods{display:grid;gap:16px}
.mod-card{display:flex;flex-direction:column;gap:14px}
.mod-card h2{font-size:24px;line-height:30px;font-weight:600}
.chs{list-style:none;margin:0;padding:0;display:grid;border-top:1px solid var(--line)}
.chs a{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none}
.chs a:hover b{color:var(--brand-strong)}
.chs .n{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.chs b{display:block;font-weight:600}
.chs small{display:block;color:var(--muted);font-size:13px;line-height:18px}
.chs .t{font-size:13px;color:var(--muted);white-space:nowrap}
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tools a{display:flex;flex-direction:column;gap:4px;padding:16px;text-decoration:none;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card)}
.tools a:hover{border-color:var(--soft)}
.tools b{font-weight:600}
.tools span{font-size:13px;line-height:18px;color:var(--muted)}
.obj{margin:0;padding-left:20px;display:grid;gap:4px;color:var(--muted);font-size:13px;line-height:20px}

/* глава */
.lesson{display:flex;flex-direction:column;gap:16px}
.lesson .goals h2,.wrapup h2{font-size:18px;line-height:24px;font-weight:600;margin-bottom:10px}
.lesson .goals ul,.wrapup ul{margin:0;padding-left:20px;display:grid;gap:6px}
.sec{display:flex;flex-direction:column;gap:16px}
.sec>.num{font-size:13px;line-height:18px;font-weight:600;color:var(--brand-strong);font-variant-numeric:tabular-nums}
.sec>h2{font-size:24px;line-height:30px;font-weight:600;margin-top:-10px}
.sec>.lead{font-size:16px;line-height:26px;color:var(--ink);font-weight:500}
.sec p{max-width:44em}
.sec strong{font-weight:600}
.key,.callout{border-radius:var(--r-sm);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.key{background:var(--brand-soft)}
.key .lbl,.callout .lbl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--brand-strong)}
.callout{background:var(--sunken)}
.callout .lbl{color:var(--muted)}
.def{border-top:1px solid var(--line);padding-top:12px}
.def h3{font-size:15px;line-height:22px;font-weight:600;margin-bottom:2px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:13px;font-weight:600}
.steps h3{font-size:15px;line-height:22px;font-weight:600}
.compare{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.compare>div{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
.compare h3{font-size:15px;line-height:22px;font-weight:600;margin-bottom:4px}
.bul{margin:0;padding-left:20px;display:grid;gap:6px}
details.more{border:1px solid var(--line);border-radius:var(--r-sm)}
details.more>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.more>summary::after{content:"+";color:var(--muted);font-weight:500}
details.more[open]>summary::after{content:"−"}
details.more>summary::-webkit-details-marker{display:none}
details.more>.body{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.tbl table{border-collapse:collapse;width:100%;font-size:13px;line-height:20px}
.tbl th{text-align:left;font-weight:600;background:var(--sunken);padding:10px 12px;white-space:nowrap}
.tbl td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top;min-width:120px}
.figref{font-size:13px;line-height:20px;color:var(--muted)}
.fig{margin:0;display:flex;flex-direction:column;gap:8px}
.fig .zoom{display:block;width:100%;padding:0;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;overflow:hidden;cursor:zoom-in}
.fig img{display:block;width:100%;height:auto;max-height:560px;object-fit:contain}
.fig video{display:block;width:100%;border-radius:var(--r-sm);background:#000}
.fig figcaption{font-size:13px;line-height:20px;color:var(--muted)}
.fig figcaption b{color:var(--ink);font-weight:600}
.fig .credit{display:block;font-size:12px;line-height:18px}
.fig .credit a{color:inherit}
.fig .miss{padding:28px 16px;text-align:center;font-size:13px;color:var(--muted);background:var(--sunken);border-radius:var(--r-sm)}
.wrapup{background:var(--sunken);border-radius:var(--r-md);padding:20px}
.practice{display:flex;flex-direction:column;gap:10px}
.practice h2{font-size:18px;line-height:24px;font-weight:600}
.practice details>summary{cursor:pointer;color:var(--brand-strong);font-weight:600}
.practice details>div{margin-top:10px;padding:14px 16px;background:var(--sunken);border-radius:var(--r-sm)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pager a{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--raised);text-decoration:none}
.pager a:hover{border-color:var(--soft)}
.pager a.next{grid-column:2;text-align:right}
.pager span{font-size:12px;line-height:16px;color:var(--muted)}
.pager b{font-weight:600}
dialog.zoomed{border:0;padding:0;background:transparent;max-width:min(1200px,96vw);max-height:94vh}
dialog.zoomed::backdrop{background:rgba(0,0,0,.82)}
dialog.zoomed img{display:block;max-width:100%;max-height:84vh;margin:0 auto;background:#fff;border-radius:var(--r-sm)}
dialog.zoomed p{color:#F2F4F7;font-size:13px;line-height:20px;margin-top:10px;text-align:center}
dialog.zoomed button{position:fixed;top:12px;right:16px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600}

/* карточки */
.card{min-height:260px;width:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:var(--shadow-card);padding:32px 24px}
.card h2{font-size:30px;line-height:36px;font-weight:700}
.card p{font-size:17px;line-height:28px;max-width:34em}
.card .hint{font-size:13px;color:var(--muted)}
.card.flipped{background:var(--brand-soft);border-color:var(--brand-soft)}
.cardnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--raised);font-size:18px}

/* самопроверка */
.qtop{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar{height:4px;background:var(--sunken);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.q h2{font-size:20px;line-height:28px;font-weight:600;margin:6px 0 14px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;line-height:22px}
.opt .l{width:26px;height:26px;border-radius:50%;background:var(--sunken);display:grid;place-items:center;font-size:13px;font-weight:600}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.expl{margin-top:12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--good-soft)}
.expl.wrong{background:var(--bad-soft)}
.expl strong{display:block;font-weight:600;margin-bottom:2px}
.score{font-size:56px;line-height:60px;font-weight:700}
.score span{font-size:24px;color:var(--muted);font-weight:500}
.review details{border-top:1px solid var(--line);padding:10px 0}
.review summary{cursor:pointer;font-weight:500}
.review p{margin-top:8px;font-size:14px;line-height:22px}

/* словарь, материалы */
.search{width:100%;font:inherit;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--raised);color:var(--ink)}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.terms article{background:var(--raised);border:1px solid transparent;border-radius:var(--r-md);padding:16px}
.terms h2{font-size:15px;line-height:22px;font-weight:600;margin-bottom:4px}
.terms p{font-size:14px;line-height:22px;color:var(--muted)}
.srcs{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.srcs li{border-bottom:1px solid var(--line);padding:10px 0;font-size:14px;line-height:22px}
.srcs a{color:var(--brand-strong);font-weight:500}
.srcs a:hover{color:var(--ink)}
.vids{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
h2.rule{font-size:20px;line-height:28px;font-weight:600}

/* интерактивные схемы: всегда на тёмной плитке */
.diagram{--panel:#22252B;--ink:#F2F4F7;--muted:#A8ADB5;--dim:#8E939B;--line:#2F3239;--accent:#F0B3CB;--soft:#4A2A3A;--font:var(--sans);
  background:#1A1D21;color:#F2F4F7;border-radius:var(--r-md);padding:22px;overflow:hidden}
.diagram .diagram-heading{font-size:14px;line-height:20px;font-weight:600;margin-bottom:16px}
.diagram-note{font-size:12px;line-height:19px;color:var(--dim);margin-top:14px}
.diagram svg{max-width:100%;height:auto;display:block}
.diagram button{font-family:var(--sans)}
.hierarchy{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
.hierarchy button{border:1px solid #2F3239;background:transparent;border-radius:7px;min-width:0;padding:14px 4px 12px;color:var(--muted);font-size:12px;line-height:18px}
.hierarchy button svg{height:38px;margin:0 auto 10px;max-width:52px}
.diagram-detail{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;font-size:14px;line-height:23px;color:#C9CDD3;min-height:76px}
.diagram-detail strong{color:#F0B3CB;font-weight:600}
.signal-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.signal-node{padding:12px 10px;border:1px solid #2F3239;background:transparent;border-radius:8px;text-align:left;font-size:12px;color:var(--muted);line-height:18px}
.signal-node span{display:block;font-size:11px;color:var(--accent);margin-bottom:4px}
.diagram-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.diagram-tab{background:transparent;border:1px solid var(--line);border-radius:7px;color:var(--muted);font-size:12px;padding:7px 12px}
.hierarchy button.selected,.signal-node.selected,.diagram-tab.selected{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.energy-bands{display:grid;gap:14px}
.energy-band{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;font-size:12px;color:var(--muted)}
.energy-ribbon{height:26px;border-radius:4px;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#eee;position:relative;overflow:hidden}
.energy-ribbon:after{content:'';position:absolute;right:0;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,#1A1D21)}
.mechanics-diagram{--mechanics-accent:var(--accent);--mechanics-muted:var(--muted);--mechanics-ink:var(--ink)}
.mechanics-intro{color:var(--mechanics-muted);font-size:13px;line-height:21px;margin:0 0 18px}
.mechanics-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,.9fr);gap:24px;align-items:center}
.mechanics-canvas{min-width:0}
.mechanics-svg{display:block;width:100%;height:auto;overflow:visible;font-family:var(--sans);font-size:12px}
.mechanics-lever-svg{max-width:360px;margin:0 auto}
.mechanics-profile-svg{max-width:680px;margin:0 auto 22px}
.mechanics-profile-svg .mechanics-svg-muted{font-size:13px}
.mechanics-svg-label{fill:var(--mechanics-ink);font-size:12px}
.mechanics-svg-muted{fill:var(--mechanics-muted);font-size:11px}
.mechanics-svg-small{font-size:10px}
.mechanics-reference{stroke:#4A4F57;stroke-width:1.5;stroke-dasharray:4 5}
.mechanics-force-line{stroke:var(--mechanics-accent);stroke-width:1;stroke-opacity:.35;stroke-dasharray:4 5}
.mechanics-dimension{fill:none;stroke:var(--mechanics-accent);stroke-width:1.5}
.mechanics-upper-arm{fill:none;stroke:#6C7179;stroke-width:12;stroke-linecap:round}
.mechanics-forearm{stroke:#C9CDD3;stroke-width:12;stroke-linecap:round}
.mechanics-pivot{fill:var(--panel);stroke:var(--mechanics-ink);stroke-width:2}
.mechanics-angle{fill:none;stroke:var(--mechanics-accent);stroke-width:1.6}
.mechanics-load{fill:#4A2A3A;stroke:var(--mechanics-accent);stroke-width:2}
.mechanics-gravity{color:var(--mechanics-accent);stroke:currentColor;stroke-width:2.5}
.mechanics-controls{display:grid;gap:22px}
.mechanics-control label{display:flex;justify-content:space-between;align-items:baseline;gap:15px;font-size:13px;font-weight:600;color:var(--mechanics-ink);line-height:20px}
.mechanics-control label span{flex-shrink:0;color:var(--mechanics-accent);font-variant-numeric:tabular-nums}
.mechanics-control input[type=range]{display:block;width:100%;min-height:32px;margin:6px 0 0;accent-color:var(--mechanics-accent);cursor:pointer}
.mechanics-control p{font-size:12px;color:var(--mechanics-muted);line-height:18px;margin-top:6px}
.mechanics-range-ends{display:flex;justify-content:space-between;gap:14px;font-size:12px;color:var(--mechanics-muted);line-height:18px}
.mechanics-range-ends span:last-child{text-align:right}
.mechanics-results{display:grid;grid-template-columns:1fr 1fr;gap:14px;border-top:1px solid var(--line);padding-top:16px;font-variant-numeric:tabular-nums}
.mechanics-results>span{display:flex;flex-direction:column;gap:6px}
.mechanics-results>span>span{color:var(--mechanics-muted);font-size:12px;line-height:16px}
.mechanics-results strong{font-size:19px;line-height:26px;color:var(--mechanics-ink);font-weight:600;white-space:nowrap}
.mechanics-formula{font-size:13px;line-height:21px;color:var(--mechanics-muted);padding:14px 0 0;margin-top:18px;border-top:1px solid var(--line)}
.mechanics-formula span{color:var(--mechanics-ink);white-space:nowrap}
.mechanics-grid{stroke:var(--line);stroke-width:1}
.mechanics-axis{fill:none;stroke:#8E939B;stroke-width:1.2}
.mechanics-curve{fill:none;stroke:var(--mechanics-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.mechanics-selection-line{stroke:var(--mechanics-muted);stroke-width:1.2;stroke-dasharray:4 4}
.mechanics-point{fill:var(--mechanics-accent);stroke:var(--panel);stroke-width:3}
.mechanics-profile-controls{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(200px,1fr);gap:26px;align-items:start}
.mechanics-profile-controls .mechanics-results{border:0;padding-top:0}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;background:var(--night);color:var(--on-night);padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
  .mbar .brand{padding:2px 0}
  .mbar button{background:var(--night-line);border:0;color:var(--on-night);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600}
  .side{display:none;position:fixed;inset:56px 0 0 0;height:auto;z-index:19;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
  .side>.brand{display:none}
  .side.open{display:flex}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
  .head h1{font-size:30px;line-height:34px}
  .tile{padding:18px}
  .tools{grid-template-columns:repeat(2,minmax(0,1fr))}
  .terms,.vids{grid-template-columns:minmax(0,1fr)}
  .card h2{font-size:24px;line-height:30px}
  .mechanics-layout,.mechanics-profile-controls{grid-template-columns:1fr;gap:20px}
  .mechanics-profile-controls .mechanics-results{border-top:1px solid var(--line);padding-top:16px}
}
@media (max-width:480px){
  .diagram{padding:18px 12px}
  .hierarchy{gap:4px}.hierarchy button{font-size:10px;padding:12px 2px}.hierarchy button svg{height:30px}
  .signal-flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .energy-band{grid-template-columns:92px 1fr;gap:9px;font-size:11px}
  .pager{grid-template-columns:1fr}.pager a.next{grid-column:1}
  .chs a{grid-template-columns:26px minmax(0,1fr)}.chs .t{display:none}
}

/* режим «Посмотреть как обучающийся» */
.preview .mode{color:var(--ds-accent-ink)}
.preview{background:var(--ds-surface-2);color:var(--ink);font-size:13px;line-height:20px;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.preview a{color:var(--ds-accent-ink);font-weight:600}

      ${svgText((left + right) / 2, 286, 'θ — угол от вертикали вниз, градусы', 'class="mechanics-svg-muted" text-anchor="middle"')}
      <path d="${curve}" class="mechanics-curve"/>
      <line x1="${x(angle).toFixed(2)}" y1="${bottom}" x2="${x(angle).toFixed(2)}" y2="${y(torque).toFixed(2)}" class="mechanics-selection-line"/>
      <circle cx="${x(angle).toFixed(2)}" cy="${y(torque).toFixed(2)}" r="6" class="mechanics-point"/>
    </svg>`;
  }

  function profileResult(angle) {
    return `<span><span>Угол θ</span><strong>${angle}°</strong></span><span><span>Внешний момент M</span><strong>${number(moment(FIXED_MASS, angle))} Н·м</strong></span>`;
  }

  function profile() {
    const id = `mechanics-${++instance}`;
    return `<div class="diagram mechanics-diagram" data-mechanics="profile" data-mechanics-id="${id}" role="group" aria-labelledby="${id}-heading">
      <h3 class="diagram-heading" id="${id}-heading">Профиль внешнего сопротивления: гантель и сила тяжести</h3>
      <p class="mechanics-intro">Груз 5 кг, сегмент 0,32 м. По горизонтали — его угол относительно вертикали вниз, по вертикали — внешний момент силы тяжести груза.</p>
      <div class="mechanics-canvas" data-mechanics-canvas>${profileSvg(id, 90)}</div>
      <div class="mechanics-profile-controls"><div class="mechanics-control"><label for="${id}-angle">Положение сегмента <span data-mechanics-angle>90°</span></label><input id="${id}-angle" type="range" min="0" max="180" step="1" value="90" data-mechanics-input="angle"><div class="mechanics-range-ends"><span>Вертикально вниз · 0°</span><span>Вертикально вверх · 180°</span></div></div><output class="mechanics-results" aria-live="polite" aria-atomic="true" for="${id}-angle" data-mechanics-result>${profileResult(90)}</output></div>
      <p class="mechanics-formula">M(θ) = 5 · 9,81 · 0,32 · sin θ</p>
      <p class="diagram-note">Теоретическая кривая для груза на конце неподвижного жёсткого сегмента: собственный вес сегмента и ускорение не учтены. 0–180° — диапазон модели, а не рекомендуемая амплитуда упражнения. Кривая описывает внешнее сопротивление; она не показывает силу мышцы, способность человека развить усилие или стимул к росту.</p>
    </div>`;
  }

  function update(diagram) {
    const angleInput = diagram.querySelector('[data-mechanics-input="angle"]');
    const isLever = diagram.dataset.mechanics === 'lever';
    const angle = clamp(Number(angleInput.value), 0, isLever ? 150 : 180);
    const massInput = diagram.querySelector('[data-mechanics-input="mass"]');
    const mass = massInput ? clamp(Number(massInput.value), 1, 20) : FIXED_MASS;
    diagram.querySelector('[data-mechanics-angle]').textContent = `${angle}°`;
    angleInput.setAttribute('aria-valuetext', `${angle} градусов от вертикали вниз`);
    if (massInput) {
      diagram.querySelector('[data-mechanics-mass]').textContent = `${number(mass)} кг`;
      massInput.setAttribute('aria-valuetext', `Масса груза: ${number(mass)} кг`);
    }
    diagram.querySelector('[data-mechanics-canvas]').innerHTML = isLever ? leverSvg(diagram.dataset.mechanicsId, mass, angle) : profileSvg(diagram.dataset.mechanicsId, angle);
    diagram.querySelector('[data-mechanics-result]').innerHTML = isLever ? leverResult(mass, angle) : profileResult(angle);
  }

  function init(container) {
    previous.init(container);
    if (!container || !container.querySelectorAll) return;
    const diagrams = Array.from(container.querySelectorAll('[data-mechanics]'));
    if (container.matches && container.matches('[data-mechanics]')) diagrams.unshift(container);
    diagrams.forEach(diagram => {
      if (diagram.dataset.mechanicsReady) return;
      diagram.dataset.mechanicsReady = 'true';
      update(diagram);
      diagram.addEventListener('input', event => {
        if (event.target && event.target.matches('[data-mechanics-input]')) update(diagram);
      });
    });
  }

  window.DIAGRAMS = Object.assign({}, previous, {
    mechanicsReady: true,
    render(kind) {
      if (kind === 'lever') return lever();
      if (kind === 'profile') return profile();
      return previous.render(kind);
    },
    init
  });
})();
</script>

      case "diagram": {

        if (!html) return "";
        const n = ++fig;
        return `<p class="figref">Разберите связь элементов на интерактивной схеме, <button type="button" class="link" data-goto="fig-${n}">рис. ${n}</button>.</p><figure class="fig" id="fig-${n}">${html}<figcaption><b>Рис. ${n}.</b> ${esc((d.diagrams || {})[b.kind] || "Учебная схема")}</figcaption></figure>`;

  const video = v => `<figure class="fig"><video controls preload="none" playsinline ${url(v.poster) ? `poster="${esc(url(v.poster))}"` : ""} src="${esc(url(v.file))}" aria-label="${esc(v.title)}"></video><figcaption><b>${esc(v.title)}</b>${v.duration ? " · " + esc(v.duration) : ""}${v.credit ? `<span class="credit">${esc(v.credit)}</span>` : ""}</figcaption></figure>`;

    <div class="meta"><span>${esc(ch.kicker)}</span><span>${minutes(ch.minutes)}</span><span>${ch.sections.length} ${plural(ch.sections.length, ["раздел", "раздела", "разделов"])}</span>${done ? '<span class="pill on">Глава изучена</span>' : ""}</div></div>
    <div class="tile goals"><h2>После главы вы сможете</h2><ul>${ch.objectives.map(o => `<li>${esc(o)}</li>`).join("")}</ul></div>
    ${ch.sections.map(section).join("")}

    ${ch.practice ? `<section class="tile practice"><span class="eyebrow">Ситуация из зала</span><h2>${esc(ch.practice.title)}</h2><p>${esc(ch.practice.prompt)}</p><details><summary>Сравнить с разбором</summary><div>${esc(ch.practice.answer)}</div></details></section>` : ""}
    <div class="row"><button type="button" class="btn${done ? " ghost" : ""}" data-done="${id}">${done ? "✓ Глава изучена" : "Отметить главу изученной"}</button><a class="btn ghost" href="#/${m.slug}/quiz/${id}">Проверить себя</a><a class="btn ghost" href="#/${m.slug}/cards/${id}">Карточки главы</a>${pdf ? `<a class="btn ghost" href="${esc(pdf)}" target="_blank" rel="noopener">Презентация, PDF</a>` : ""}</div>
    <nav class="pager" aria-label="Соседние главы">${prev ? `<a href="#/${m.slug}/${prev.id}"><span>Предыдущая глава</span><b>${esc(prev.shortTitle)}</b></a>` : ""}${next ? `<a class="next" href="#/${m.slug}/${next.id}"><span>Следующая глава</span><b>${esc(next.shortTitle)}</b></a>` : `<a class="next" href="#/${m.slug}/quiz"><span>Дальше</span><b>Итоговая самопроверка</b></a>`}</nav></article>`;
}

/* ---------- карточки ---------- */
function chapterChips(m, d, sel, kind) {
  return `<div class="chips" role="group" aria-label="Глава"><a class="chip" href="#/${m.slug}/${kind}" ${!sel ? ' aria-current="page"' : ""}>Все главы</a>${d.chapters.map(c => `<a class="chip" href="#/${m.slug}/${kind}/${c.id}" ${sel === c.id ? ' aria-current="page"' : ""}>${pad(c.id)} ${esc(c.shortTitle)}</a>`).join("")}</div>`;
}
function cardsList(m, d, ch) {
  const known = store.get(m.slug).known;
  return d.cards.filter(c => (!ch || c.chapter === ch) && (!card.unknown || !known.includes(c.id)));
}
function cardsBody(m, d, ch) {
  const list = cardsList(m, d, ch), known = store.get(m.slug).known;
  if (!list.length) return `<div class="tile gate"><h2>Все карточки этой подборки знакомы</h2><div class="row"><button type="button" class="btn" data-card="all">Показать все снова</button></div></div>`;
  card.i = Math.max(0, Math.min(card.i, list.length - 1));

    <button type="button" class="card${card.flip ? " flipped" : ""}" data-card="flip"><span class="eyebrow">Глава ${pad(c.chapter)} · ${card.flip ? "определение" : "вспомните определение"}</span>${card.flip ? `<p>${esc(c.definition)}</p>` : `<h2>${esc(c.term)}</h2>`}<span class="hint">Нажмите, чтобы ${card.flip ? "вернуться к термину" : "увидеть ответ"}</span></button>
    <div class="cardnav"><button type="button" class="round" data-card="prev" aria-label="Предыдущая">←</button><button type="button" class="btn${k ? " ghost" : ""}" data-card="known" data-id="${c.id}">${k ? "✓ Знаю" : "Знаю это"}</button><button type="button" class="round" data-card="next" aria-label="Следующая">→</button></div>

}

/* ---------- самопроверка ---------- */
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startQuiz(m, d, ch, size) {
  let pool = d.quiz.filter(q => !ch || q.chapter === ch);
  if (!ch && size !== "all") pool = d.chapters.flatMap(c => { const g = shuffle(pool.filter(q => q.chapter === c.id)); const a = g.find(q => q.kind !== "case") || g[0]; const b = g.find(q => q.kind === "case" && q !== a) || g.find(q => q !== a); return [a, b].filter(Boolean); }).slice(0, 10);
  const items = pool.map(q => { const o = shuffle(q.options.map((t, i) => ({ t, ok: i === q.correct }))); return { ...q, options: o.map(x => x.t), correct: o.findIndex(x => x.ok) }; });
  quiz = { items, i: 0, answers: [], sel: null, checked: false, done: false, ch };
}
function quizBody(m, d, ch) {
  if (!quiz) {
    const n = d.quiz.filter(q => !ch || q.chapter === ch).length, last = store.get(m.slug).last;
    return `<div class="tile gate"><span class="eyebrow">${ch ? "Глава " + pad(ch) : "Весь модуль"}</span><h2>${ch ? esc(d.chapters.find(c => c.id === ch).title) : esc(m.title)}</h2>
      <p>Выберите один ответ. После проверки появится разбор, даже если ответ верный. В конце можно вернуться к главам, где были ошибки.</p>
      <div class="row">${ch ? `<button type="button" class="btn" data-quiz="start" data-size="all">Начать, ${n} ${plural(n, ["вопрос", "вопроса", "вопросов"])}</button>` : `<button type="button" class="btn" data-quiz="start" data-size="10">Короткая проверка, 10 вопросов</button><button type="button" class="btn ghost" data-quiz="start" data-size="all">Все ${n} ${plural(n, ["вопрос", "вопроса", "вопросов"])}</button>`}</div>
      ${last && !ch ? `<p class="note">Последний результат по модулю: ${last.correct} из ${last.total}.</p>` : ""}</div>`;
  }

    const wrong = [...new Set(quiz.items.filter((q, i) => quiz.answers[i] !== q.correct).map(q => q.chapter))];
    return `<div class="tile gate"><span class="eyebrow">Самопроверка завершена</span><div class="score">${ok}<span> / ${quiz.items.length}</span></div>
      <p>${wrong.length ? "Вернитесь к разборам и главам ниже, затем пройдите ещё раз." : "Все ответы верны."}</p>
      ${wrong.length ? `<div class="row">${wrong.map(c => `<a class="btn ghost" href="#/${m.slug}/${c}">Глава ${pad(c)}: ${esc(d.chapters.find(x => x.id === c).shortTitle)}</a>`).join("")}</div>` : ""}
      <div class="row"><button type="button" class="btn" data-quiz="again">Пройти ещё раз</button></div>
      <div class="review">${quiz.items.map((q, i) => `<details><summary>${quiz.answers[i] === q.correct ? "✓" : "✗"} ${esc(q.question)}</summary><p><b>Ваш ответ:</b> ${esc(q.options[quiz.answers[i]])}<br><b>Верно:</b> ${esc(q.options[q.correct])}</p><p>${esc(q.explanation)}</p></details>`).join("")}</div></div>`;
  }
  const q = quiz.items[quiz.i];
  return `<div class="qtop"><span>Вопрос ${quiz.i + 1} из ${quiz.items.length}</span><span>Глава ${pad(q.chapter)}</span></div><div class="bar"><i style="width:${quiz.i / quiz.items.length * 100}%"></i></div>
    <div class="tile q"><span class="eyebrow">${esc(d.chapters.find(c => c.id === q.chapter).shortTitle)}</span><h2>${esc(q.question)}</h2>
    <div class="opts" role="group" aria-label="Варианты ответа">${q.options.map((o, i) => `<button type="button" class="opt${quiz.checked && i === q.correct ? " right" : ""}${quiz.checked && quiz.sel === i && i !== q.correct ? " wrong" : ""}" data-quiz="pick" data-i="${i}" aria-pressed="${quiz.sel === i}" ${quiz.checked ? "disabled" : ""}><span class="l">${quiz.checked && i === q.correct ? "✓" : LETTERS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    ${quiz.checked ? `<div class="expl${quiz.sel === q.correct ? "" : " wrong"}" role="status"><strong>${quiz.sel === q.correct ? "Верно" : "Верный ответ: " + LETTERS[q.correct]}</strong>${esc(q.explanation)}</div>` : ""}
    <div class="row" style="margin-top:14px">${quiz.checked ? `<button type="button" class="btn" data-quiz="next">${quiz.i === quiz.items.length - 1 ? "Результат" : "Следующий вопрос"}</button>` : `<button type="button" class="btn" data-quiz="check" ${quiz.sel === null ? "disabled" : ""}>Проверить</button>`}</div></div>`;
}
function quizView(m, d, ch) {
  return `<div class="head"><span class="eyebrow">${esc(m.title)} · понимание и применение</span><h1>Самопроверка</h1><p class="lead">Вопросы по главам и ситуации из тренерской практики.</p></div>${chapterChips(m, d, ch, "quiz")}<div id="quiz" class="page" style="gap:12px">${quizBody(m, d, ch)}</div>`;

/* ---------- словарь и материалы ---------- */
function terms(list) {

    <input class="search" type="search" id="q" placeholder="Термин или слово из определения" aria-label="Найти термин" autocomplete="off"><div class="terms" id="terms">${terms(d.glossary)}</div>`;

function materialsView(m, d) {

    ${pdf || m.textUrl ? `<div class="row">${pdf ? `<a class="btn" href="${esc(pdf)}" target="_blank" rel="noopener">Презентация лекции, PDF</a>` : ""}${m.textUrl ? `<a class="btn ghost" href="${esc(m.textUrl)}" target="_blank" rel="noopener">Полный текст лекции</a>` : ""}</div>` : ""}
    ${vids.length ? `<h2 class="rule">Видео</h2><div class="vids">${vids.map(v => `<figure class="fig"><video controls preload="none" playsinline ${url(v.poster) ? `poster="${esc(url(v.poster))}"` : ""} src="${esc(url(v.file))}"></video><figcaption><b>${esc(v.title)}</b>${v.duration ? " · " + esc(v.duration) : ""}${v.credit ? `<span class="credit">${esc(v.credit)}</span>` : ""}</figcaption></figure>`).join("")}</div>` : ""}
    <h2 class="rule">Литература и исследования</h2><ul class="srcs">${d.sources.map(s => `<li>${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>` : esc(s.title)}</li>`).join("")}</ul>`;

/* ---------- отрисовка ---------- */
const TITLES = { home: "Курс для тренеров", cards: "Карточки", quiz: "Самопроверка", glossary: "Словарь", materials: "Материалы" };
async function render() {
  const r = route(), t = ++seq, main = $("#main");
  sidebar(r);
  $("#side").classList.remove("open");
  const put = (html, title) => { if (t !== seq) return; main.innerHTML = `${PREVIEW ? `<div class="preview" role="status"><b class="mode">Просмотр как обучающийся.</b> Интерфейс и материалы те же, что у ученика; отметки глав и результаты тестов не сохраняются. <a href="../admin/">Вернуться в кабинет владельца</a> · <a href="./">Выйти из просмотра</a></div>` : ""}<div class="page">${html}</div>`; document.title = (title ? title + " · " : "") + "Обучение · Больше чем качалка"; if (window.DIAGRAMS) window.DIAGRAMS.init(main); };

  if (r.view === "module") return put(moduleView(r.mod), r.mod.title);
  const m = r.mod, chOutline = r.ch && m.chapters.find(c => c.id === r.ch);
  if (!session || !access) return put(`<div class="head"><span class="eyebrow">${esc(m.title)}</span><h1>${esc(chOutline && r.view === "chapter" ? chOutline.title : TITLES[r.view])}</h1></div>${gateBox()}`, TITLES[r.view] || m.title);
  put(`<div class="skel" aria-busy="true"><span class="sr">Загружаем…</span><i></i><i></i><i></i></div>`, m.title);
  let d;
  try { d = await loadModule(m.slug); await syncProgress(m.slug); if (r.view === "chapter") track("course_visit", { slug: m.slug, chapter: r.ch, last_at: new Date().toISOString() }, "upsert"); } catch (e) { return put(`<div class="tile gate"><h2>Материалы не загрузились</h2><p class="note">Проверьте интернет и обновите страницу. Если не поможет, напишите на <a href="mailto:${EMAIL}">${EMAIL}</a>.</p></div>`, m.title); }
  if (r.view === "chapter") { await sign(figuresOf(d.chapters.find(c => c.id === r.ch)).concat(m.pdf || [])); put(chapterView(m, d, r.ch), chOutline.shortTitle); scrollTo(0, 0); return; }
  if (r.view === "materials") await sign(d.chapters.flatMap(figuresOf).concat(m.pdf || []));
  const key = m.slug + "/" + r.ch;
  if (r.view === "quiz" && quizKey !== key) { quiz = null; quizKey = key; }
  if (r.view === "cards") card = { i: 0, flip: false, unknown: card.unknown };
  const view = { cards: cardsView, quiz: quizView, glossary: glossaryView, materials: materialsView }[r.view];
  put(view(m, d, r.ch), TITLES[r.view]);
  scrollTo(0, 0);
}

/* ---------- действия ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("button,a");
  if (!el) return;
  const r = route(), m = r.mod, d = m && content[m.slug];
  if (el.id === "menu") { $("#side").classList.toggle("open"); el.setAttribute("aria-expanded", $("#side").classList.contains("open")); return; }
  if (el.hasAttribute("data-logout")) { await sb.auth.signOut({ scope: "local" }); session = null; access = false; render(); return; }
  if (el.hasAttribute("data-login-scroll")) { e.preventDefault(); if (location.hash !== "#/" && location.hash !== "") location.hash = "#/"; else render(); setTimeout(() => { const i = $("#gate input"); if (i) i.focus(); }, 50); return; }
  if (el.dataset.goto) { const f = document.getElementById(el.dataset.goto); if (f) f.scrollIntoView({ behavior: "smooth", block: "center" }); return; }
  if (el.dataset.zoom) { zoom(url(el.dataset.zoom), el.dataset.cap); return; }
  if (el.dataset.done && m) { const s = store.get(m.slug), id = +el.dataset.done, was = s.done.includes(id); s.done = was ? s.done.filter(x => x !== id) : s.done.concat(id); store.set(m.slug, s); track("course_progress", { slug: m.slug, chapter: id }, was ? "delete" : "insert"); render(); return; }

    if (a === "prev") { card.i = (card.i - 1 + list.length) % Math.max(list.length, 1); card.flip = false; }
    if (a === "unknown") { card.unknown = !card.unknown; card.i = 0; card.flip = false; }
    if (a === "all") { card.unknown = false; card.i = 0; }
    if (a === "known") { const s = store.get(m.slug), id = +el.dataset.id; s.known = s.known.includes(id) ? s.known.filter(x => x !== id) : s.known.concat(id); store.set(m.slug, s); if (card.unknown && s.known.includes(id)) card.flip = false; else { card.i = (card.i + 1) % Math.max(list.length, 1); card.flip = false; } }

  }

    if (a === "again") quiz = null;
    if (a === "pick" && quiz && !quiz.checked) quiz.sel = +el.dataset.i;
    if (a === "check" && quiz && quiz.sel !== null) { quiz.checked = true; quiz.answers[quiz.i] = quiz.sel; }
    if (a === "next" && quiz) {
      if (quiz.i === quiz.items.length - 1) { quiz.done = true; track("quiz_attempt", { slug: m.slug, chapter: quiz.ch || null, correct: quiz.answers.filter((x, i) => x === quiz.items[i].correct).length, total: quiz.items.length, answers: quiz.items.map((q, i) => ({ q: q.question, a: quiz.answers[i], ok: quiz.answers[i] === q.correct })) }); if (!quiz.ch) { const s = store.get(m.slug); s.last = { correct: quiz.answers.filter((x, i) => x === quiz.items[i].correct).length, total: quiz.items.length }; store.set(m.slug, s); } }
      else { quiz.i++; quiz.sel = null; quiz.checked = false; }
    }
    $("#quiz").innerHTML = quizBody(m, d, r.ch);
    if (a === "next" || a === "start") $("#quiz").scrollIntoView({ block: "start" });
  }
});
document.addEventListener("submit", async e => {
  if (!e.target.matches("[data-login]")) return;
  e.preventDefault();
  const f = e.target, msg = $("[data-login-msg]"), btn = f.querySelector("button"), email = f.email.value.trim().toLowerCase();
  btn.disabled = true; msg.className = "note"; msg.textContent = "Отправляем…";
  try { localStorage.setItem("bchk-learn-next", location.hash || "#/"); } catch {}
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.href.split("#")[0] } });
  btn.disabled = false;
  if (error) { msg.className = "note err"; msg.textContent = /rate|seconds/i.test(error.message) ? "Письмо уже отправлено. Новое можно запросить через минуту." : "Не получилось отправить письмо. Проверьте адрес и попробуйте ещё раз."; return; }
  msg.className = "note ok"; msg.textContent = `Ссылка для входа отправлена на ${email}. Откройте письмо на этом устройстве.`;
});
document.addEventListener("input", e => {
  if (e.target.id !== "q") return;
  const r = route(), d = r.mod && content[r.mod.slug]; if (!d) return;
  const q = e.target.value.trim().toLowerCase();
  $("#terms").innerHTML = terms(d.glossary.filter(t => (t.term + " " + t.definition).toLowerCase().includes(q)));
});

let dlg;
function zoom(src, cap) {
  if (!src) return;
  if (!dlg) { dlg = document.createElement("dialog"); dlg.className = "zoomed"; dlg.addEventListener("click", e => { if (e.target === dlg || e.target.tagName === "BUTTON") dlg.close(); }); document.body.append(dlg); }
  dlg.innerHTML = `<button type="button">Закрыть</button><img src="${esc(src)}" alt="${esc(cap)}"><p>${esc(cap)}</p>`;
  dlg.showModal();
}

/* ошибка из письма со ссылкой для входа */
function authError() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (!p.get("error") && !p.get("error_code")) return "";
  history.replaceState(null, "", location.pathname + location.search);
  return p.get("error_code") === "otp_expired" ? "Ссылка для входа устарела или уже использована. Запросите новую." : "Войти по ссылке не получилось. Запросите новую.";
}

window.addEventListener("hashchange", render);
sb.auth.onAuthStateChange((ev, s) => {
  if (!ready) return;
  if (ev === "SIGNED_IN" && !session) checkAccess().then(render);
  if (ev === "SIGNED_OUT") { session = null; access = false; render(); }
});
(async () => {
  const err = authError();
  render();
  await checkAccess();
  let next = ""; try { next = localStorage.getItem("bchk-learn-next") || ""; localStorage.removeItem("bchk-learn-next"); } catch {}
  if (session && next && next.startsWith("#/") && !location.hash.startsWith("#/")) location.replace(location.pathname + next);
  else if (!location.hash.startsWith("#/") && location.hash) history.replaceState(null, "", location.pathname + location.search);
  await render();
  if (err) { const msg = $("[data-login-msg]"); if (msg) { msg.className = "note err"; msg.textContent = err; } }
})();
})();

<script>(function(){
