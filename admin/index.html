<style>/* Дизайн-система «Больше чем качалка» (claude.ai/artifact/HpsP3UNzJYzCUSz1XukX4j («Холст · Сланец · Малина», в неё влита «Больше чем качалка»), tokens.json): светлая и «Сланец».
   Цвет в две роли: малина = «где ты» (шкала s1–s5: этап, тип дня, текущее место), голубой = «что делать» (ссылки, инструкция).
   Нейтральный холодный холст, белые карточки отделяются тоном, без рамок и теней. Главная кнопка графитовая.
   Подключается первым на всех страницах. Имена --ds-* сохранены, чтобы стили страниц не переписывать:
   --ds-brand = главная кнопка, --ds-brand-strong = ссылка, --ds-accent = малина «где ты». */
:root{
  /* нейтральные */
  --ds-bg:#CED6DD; --ds-surface:#FFFFFF; --ds-surface-2:#EEF1F4; --ds-line:#C9D1D8; --ds-ctrl:#66717D; --ds-rest:#E3E8EC;
  --ds-ink:#20252B; --ds-ink-2:#535E69; --ds-ink-3:#7D8894;
  /* главная кнопка и ссылки */
  --ds-brand:#20252B; --ds-on-brand:#FFFFFF; --ds-brand-strong:#2F567B; --ds-brand-soft:#EBF0F6;
  --ds-info:#5F8DB8; --ds-instr-k:#2F567B;
  /* малина: шкала s1–s5 и текст на ней */
  --ds-s1:#F4E1E8; --ds-s2:#E9BFCF; --ds-s3:#D995AF; --ds-s4:#CA7196; --ds-s5:#A5466D; --ds-on-s:#0E1521;
  --ds-accent:#E9BFCF; --ds-on-accent:#0E1521; --ds-accent-ink:#A5466D; --ds-accent-soft:#F4E1E8;
  /* тёмная плашка (основная работа в дневнике, шапка кабинета владельца): графит, как главная кнопка */
  --ds-deep:#20252B; --ds-on-deep:#FFFFFF;
  /* статусы: в системе их нет, оставлены прежние значения, всегда со словом или значком */
  --ds-up:#1d7348; --ds-down:#b8322a;
  --ds-shadow-card:none; --ds-shadow-pop:0 8px 24px rgba(14,21,33,.14);
  --ds-ph1:#F4E1E8; --ds-ph2:#E9BFCF; --ds-ph3:#D995AF; --ds-ph4:#CA7196;
  --ds-on-s4:#0E1521;
  --ds-r-xs:4px; --ds-r-sm:8px; --ds-r-md:10px; --ds-r-lg:14px;
  /* переход малина → голубой: только полоса под превью на главной */
  --ds-g1:#E9BFCF; --ds-g2:#BBD3EA; --ds-band-end:#A9C4DE;
  --ds-link-line:color-mix(in srgb, var(--ds-brand-strong) 35%, transparent);
  /* вторичная кнопка и фон ссылки при наведении: ink 7 % */

  --ds-sans:"Inter","Inter Display",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

/* Шрифт: одна гарнитура Inter; заголовки 800 с отрицательным трекингом, цифры табличные */
body{font-family:var(--ds-sans)}
h1{letter-spacing:-0.04em}
h2,h3{letter-spacing:-0.02em}
.num, td, .stat b, .phases span{font-variant-numeric:tabular-nums}

/* Ссылки (правила L1–L2). Ссылки интерфейса без подчёркивания: место, вес, цвет, фон при наведении.
   Ссылка внутри предложения: цвет и тонкая полупрозрачная линия, при наведении линия полная. */
a{text-decoration:none}
:is(p, small, .note, .lead) a:not(.btn):not(.tbtn):not(.vid){color:var(--ds-brand-strong);font-weight:600;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:var(--ds-link-line)}
:is(p, small, .note, .lead) a:not(.btn):not(.tbtn):not(.vid):hover{text-decoration-color:currentColor}
:where(a, button, summary, [role="button"]){cursor:pointer}
:where(a, button, summary, input, select, textarea, video):focus-visible{outline:2px solid var(--ds-ink);outline-offset:2px}
/* флажки и плеер видео: браузер не всегда считает их фокус «видимым», поэтому обводка по обычному фокусу */
input[type="checkbox"]:focus, input[type="radio"]:focus, input[type="date"]:focus-within, video:focus-within{outline:2px solid var(--ds-ink);outline-offset:2px}
/* ссылка «К содержанию»: видна только при фокусе с клавиатуры (2.4.1) */
.skip{position:absolute;left:-9999px;top:8px}
.skip:focus{left:16px;z-index:40;min-height:32px;display:inline-flex;align-items:center;background:var(--ds-surface);color:var(--ds-ink);padding:8px 12px;border-radius:var(--ds-r-sm)}

/* Знак: контур названия, цвет ink в обеих темах; в шапке сайта переход малина → серо-голубой (acctext → link) */
:root{--ds-wm-a:var(--ds-accent-ink);--ds-wm-b:var(--ds-brand-strong)}
.wordmark{display:block;height:20px;width:auto;color:var(--ds-ink)}

/* Текст только для экранных дикторов */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* E2: заготовка загрузки той же формы, что контент: заголовок, карточка, строка; без анимации */
.skel{display:grid;gap:12px;padding-block:16px}
.skel i{display:block;height:16px;border-radius:var(--ds-r-sm);background:var(--ds-surface-2)}
.skel i:nth-of-type(1){width:40%;height:32px}
.skel i:nth-of-type(2){height:120px;border-radius:var(--ds-r-lg)}
.skel i:nth-of-type(3){width:70%}
/* DD2, DD9: выпадающий список как остальные поля, один шеврон 16 px цвета вторичного текста */
select:not([multiple]){appearance:none;-webkit-appearance:none;padding-right:36px;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%206l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23535E69%22%20stroke-width%3D%221.75%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;background-size:16px 16px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) select:not([multiple]){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%206l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23A8ADB5%22%20stroke-width%3D%221.75%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E")}}
:root[data-theme="dark"] select:not([multiple]){background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Cpath%20d%3D%22M4%206l4%204%204-4%22%20fill%3D%22none%22%20stroke%3D%22%23A8ADB5%22%20stroke-width%3D%221.75%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E")}

/* переключатель темы: значок 20 px цвета текста, нажатое состояние = тёмная тема включена */
.theme-btn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;color:inherit;font:inherit;cursor:pointer;border-radius:var(--ds-r-sm);padding:10px;min-height:44px;min-width:44px;justify-content:center}
.theme-btn:hover{background:var(--ds-btn2)}
.theme-btn .ico{width:20px;height:20px;flex:none}
.theme-btn[aria-pressed="true"] .ico path{fill:currentColor}

:root{--sans:var(--ds-sans)}
*{box-sizing:border-box}
body{margin:0;background:var(--ds-bg);color:var(--ds-ink);font:400 15px/22px var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--ds-brand-strong)}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--ds-brand);outline-offset:2px;border-radius:4px}
.top{background:var(--ds-surface-2);color:var(--ds-ink)}
.top .in{max-width:1120px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px 16px;flex-wrap:wrap}
.top a{color:inherit;text-decoration:none;font-size:14px}
.top .brand .wordmark{height:18px}
.top .brand{font-weight:800;letter-spacing:-0.02em;font-size:16px}
.top .brand span{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ds-ink-2)}
.top nav{display:flex;gap:4px;flex-wrap:wrap}
.top nav a,.top nav button{padding:8px 10px;border-radius:var(--ds-r-md);background:none;border:0;color:inherit;font:500 14px/18px var(--sans);cursor:pointer}
.top nav a:hover,.top nav button:hover{background:var(--ds-rest)}
main{max-width:1120px;margin:0 auto;padding:24px 16px 64px;display:grid;gap:16px}
h1{font-size:32px;line-height:38px;font-weight:800}
.tile{background:var(--ds-surface);border:1px solid transparent;border-radius:var(--ds-r-lg);padding:20px;display:grid;gap:12px;min-width:0}
.tile h2{font-size:19px;line-height:24px;font-weight:600}
.muted{color:var(--ds-ink-2);font-size:13px;line-height:18px}
.grow{flex:1}
.check{display:flex;flex-direction:row;gap:8px;align-items:center}
.check input{min-height:0;width:24px;height:24px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;background:var(--ds-brand);color:var(--ds-on-brand);border:0;border-radius:var(--ds-r-md);padding:10px 18px;font:600 14px/18px var(--sans);text-decoration:none;cursor:pointer}
.btn.accent{background:var(--ds-brand);color:var(--ds-on-brand)}
.btn.ghost{background:var(--ds-btn2);color:var(--ds-ink);border:0}
.btn:disabled{opacity:.6;cursor:progress}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;display:flex;gap:12px;align-items:center;max-width:calc(100vw - 32px);background:var(--ds-ink);color:var(--ds-surface);padding:12px 16px;border-radius:var(--ds-r-md);box-shadow:var(--ds-shadow-pop);font-size:14px;line-height:20px}
.toast[hidden]{display:none}
.toast button{background:none;border:0;color:inherit;font:600 14px/20px var(--sans);text-decoration:none;padding:4px 8px;border-radius:var(--ds-r-sm);min-height:32px}
.toast button:hover{background:color-mix(in srgb, var(--ds-surface) 15%, transparent)}
label{display:grid;gap:4px;font-size:13px;color:var(--ds-ink-2)}
input,select{font:500 14px/18px var(--sans);color:var(--ds-ink);background:var(--ds-surface);border:1px solid var(--ds-ctrl);border-radius:var(--ds-r-sm);padding:10px;min-height:44px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat b{display:block;font-size:28px;line-height:34px;font-weight:300;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ds-ink-2)}
.users{display:grid;gap:10px}
.user{border:0;border-radius:var(--ds-r-md);padding:14px;display:grid;gap:10px;background:var(--ds-surface-2)}
.user .h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.user .h b{overflow-wrap:anywhere}
.user dl{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 12px;font-size:13px;line-height:18px}
.user dt{color:var(--ds-ink-2)}
.user dd{margin:0;font-weight:500}
.pill{display:inline-block;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--ds-surface-2);color:var(--ds-ink-2)}
.pill.on{background:var(--ds-brand-soft);color:var(--ds-brand-strong)}
.note{font-size:13px;line-height:18px;color:var(--ds-ink-2)}
.err{color:var(--ds-down)}
table{width:100%;border-collapse:collapse;font-size:13px;line-height:18px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ds-line);vertical-align:top}
th{color:var(--ds-ink-2);font-weight:500}
.scroll{overflow-x:auto}
@media (max-width:860px){.grid2,.stats{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.user dl{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media (max-width:560px){.grid2{grid-template-columns:minmax(0,1fr)}h1{font-size:26px;line-height:32px}}
</style>

<script>
const SUPABASE_URL = "https://selgcdicdtjpcsrfrqdq.supabase.co", SUPABASE_KEY = "sb_publishable_wLlkgxHctEZyUzB0TSlUmQ_R_m-t4ca";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s), main = $("#main");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dt = v => v ? new Date(v).toLocaleString("ru-RU", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "нет";
const d0 = v => v ? new Date(v).toLocaleDateString("ru-RU", { day: "numeric", month: "short", year: "numeric" }) : "нет";
let me = null, USERS = [], PENDING = [], PROGRAMS = [], ATTEMPTS = [];

function loginView(msg) {
  main.innerHTML = `<h1>Кабинет владельца</h1><div class="tile"><h2>Вход</h2><p class="note">Ссылка для входа придёт на почту. Кабинет открывается только учётной записи с ролью тренера: права проверяет база.</p>
    <div class="row"><label class="grow">Почта<input id="em" type="email" autocomplete="email"></label><button class="btn" id="login" type="button">Прислать ссылку</button></div><p class="note" id="lmsg" role="status">${esc(msg || "")}</p></div>`;
  $("#login").onclick = async () => { const em = $("#em").value.trim(); if (!em || !$("#em").checkValidity()) { $("#lmsg").textContent = "Проверьте адрес почты."; return; }
    $("#login").disabled = true; const { error } = await sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.href.split("#")[0], shouldCreateUser: false } });
    $("#login").disabled = false; $("#lmsg").textContent = error ? "Не получилось отправить ссылку. Если это новая почта, сначала войдите через личный кабинет." : `Ссылка отправлена на ${em}.`; };
}

async function load() {
  const [u, p, pr, qa] = await Promise.all([sb.rpc("admin_users"), sb.rpc("admin_pending_access"), sb.from("program").select("id, slug, title").order("position"),
    sb.from("quiz_attempt").select("user_id, slug, chapter, correct, total, created_at").order("created_at", { ascending: false }).limit(50)]);
  if (u.error) return u.error;
  USERS = u.data || []; PENDING = p.data || []; PROGRAMS = pr.data || []; ATTEMPTS = qa.data || [];
  return null;
}

function view() {
  const withCourse = USERS.filter(x => x.course_access).length, active = USERS.filter(x => x.chapters_opened > 0).length;
  const progName = s => (PROGRAMS.find(p => p.slug === s) || {}).title || s;
  const email = id => (USERS.find(x => x.user_id === id) || {}).email || "удалён";
  const modTitle = s => (window.OUTLINE.find(m => m.slug === s) || {}).title || s;
  main.innerHTML = `<h1>Кабинет владельца</h1>
  <div class="tile"><h2>Курс глазами обучающегося</h2><p class="note">Открывается тот же интерфейс курса, что у ученика: главы, карточки, самопроверка. В режиме просмотра отметки и результаты тестов не сохраняются.</p>
    <div class="row"><a class="btn accent" href="../learn/?preview#/">Посмотреть как обучающийся</a><a class="btn ghost" href="../learn/?preview#/anatomy/1">Открыть первую главу</a></div>
    <p class="note">Экран человека без доступа: откройте <a href="../learn/">раздел курса</a> в приватном окне браузера.</p></div>
  <div class="stats"><div class="tile stat"><b>${USERS.length}</b><span>учётных записей</span></div><div class="tile stat"><b>${withCourse}</b><span>с доступом к курсу</span></div><div class="tile stat"><b>${PENDING.length}</b><span>доступ выдан, ещё не входили</span></div><div class="tile stat"><b>${active}</b><span>открывали главы</span></div></div>
  <div class="grid2">
    <div class="tile"><h2>Открыть курс</h2><p class="note">Доступ выдаётся по почте до первого входа. Оплата на сайте не подключена: основанием служит ваша запись, её текст виден в списке.</p>
      <label>Почта<input id="ga-em" type="email" placeholder="name@mail.ru"></label><label>Основание (оплата, договор, подарок…)<input id="ga-note"></label>
      <div class="row"><button class="btn" id="ga" type="button">Открыть курс</button><label class="check"><input type="checkbox" id="ga-lib"> и отдельно библиотеку</label></div><p class="note" id="ga-msg" role="status"></p></div>
    <div class="tile"><h2>Назначить программу</h2><p class="note">Человек должен хотя бы раз войти на сайт. Неделя в кабинете считается от даты старта.</p>
      <label>Пользователь<select id="ap-u">${USERS.map(x => `<option value="${x.user_id}">${esc(x.email)}</option>`).join("")}</select></label>
      <label>Программа<select id="ap-p">${PROGRAMS.map(x => `<option value="${x.id}">${esc(x.title)}</option>`).join("")}</select></label>
      <label>Дата старта<input id="ap-d" type="date" value="${new Date().toISOString().slice(0, 10)}"></label>
      <div class="row"><button class="btn" id="ap" type="button">Назначить</button></div><p class="note" id="ap-msg" role="status"></p></div>
  </div>
  <div class="tile"><h2>Пользователи и доступ</h2>
    <p class="note">«Открывал главы» и «отметил изученными»: разные события. Первое записывается при открытии главы, второе только по кнопке «Глава изучена». Сбор идёт с момента включения записи прогресса; раньше прогресс хранился только в браузере ученика. Покупок в системе нет: оплата не подключена.</p>
    <div class="users">${USERS.map(x => `<div class="user"><div class="h"><b>${esc(x.email)}</b><span>${x.role !== "client" ? `<span class="pill on">${esc(x.role)}</span> ` : ""}<span class="pill ${x.course_access ? "on" : ""}">${x.course_access ? "курс открыт" : "курс закрыт"}</span></span></div>
      <dl><div><dt>Регистрация</dt><dd>${d0(x.registered_at)}</dd></div><div><dt>Последний вход</dt><dd>${dt(x.last_sign_in_at)}</dd></div>
      <div><dt>Основание доступа</dt><dd>${x.course_access ? esc(x.course_note || "без пометки") + ", " + d0(x.course_granted_at) : "нет"}</dd></div>
      <div><dt>Программы</dt><dd>${x.programs.length ? x.programs.map(p => esc(progName(p.slug)) + " (" + esc({ active: "идёт", finished: "завершена", paused: "пауза" }[p.status] || p.status) + ", с " + d0(p.start) + ")").join("; ") : "нет"}</dd></div>
      <div><dt>Открывал глав</dt><dd>${x.chapters_opened}</dd></div><div><dt>Отметил изученными</dt><dd>${x.chapters_done}</dd></div>
      <div><dt>Попыток тестов</dt><dd>${x.quiz_attempts}${x.quiz_last ? ", последняя " + esc(x.quiz_last) : ""}</dd></div><div><dt>Последняя активность в курсе</dt><dd>${dt(x.last_activity)}</dd></div></dl>
      <div class="row">${x.course_access ? `<button class="btn ghost" type="button" data-revoke="${esc(x.email)}">Закрыть курс</button>` : `<button class="btn ghost" type="button" data-grant="${esc(x.email)}">Открыть курс</button>`}</div></div>`).join("") || `<p class="note">Пока никого.</p>`}</div></div>
  <div class="tile"><h2>Доступ выдан, но ещё не входили</h2>${PENDING.length ? `<div class="scroll"><table><tr><th>Почта</th><th>Основание</th><th>Выдан</th><th></th></tr>${PENDING.map(x => `<tr><td>${esc(x.email)}</td><td>${esc(x.note || "")}</td><td>${d0(x.granted_at)}</td><td><button class="btn ghost" type="button" data-revoke="${esc(x.email)}">Отозвать</button></td></tr>`).join("")}</table></div>` : `<p class="note">Нет.</p>`}</div>
  <div class="tile"><h2>Последние попытки самопроверки</h2><p class="note">Показано число верных ответов. Критерия «сдал» в курсе нет, ручной проверки нет.</p>${ATTEMPTS.length ? `<div class="scroll"><table><tr><th>Когда</th><th>Кто</th><th>Модуль</th><th>Глава</th><th>Результат</th></tr>${ATTEMPTS.map(a => `<tr><td>${dt(a.created_at)}</td><td>${esc(email(a.user_id))}</td><td>${esc(modTitle(a.slug))}</td><td>${a.chapter || "весь модуль"}</td><td>${a.correct} из ${a.total}</td></tr>`).join("")}</table></div>` : `<p class="note">Попыток пока нет.</p>`}</div>`;
  $("#ga").onclick = () => grant($("#ga-em").value, $("#ga-note").value, $("#ga-lib").checked, "#ga-msg", $("#ga"));
  $("#ap").onclick = assign;
  main.querySelectorAll("[data-grant]").forEach(b => b.onclick = () => grant(b.dataset.grant, "", false, null, b));
  main.querySelectorAll("[data-revoke]").forEach(b => b.onclick = () => revoke(b.dataset.revoke, b));
}

async function refresh() { const e = await load(); if (e) return denied(e); view(); }
// W3: что случилось и что делать; технический текст ошибки только в консоль
function why(e) {
  console.warn(e);
  const m = (e && (e.message || "")) + "";
  if (e && (e.status === 0 || /fetch|network/i.test(m))) return "нет связи с сервером. Проверьте интернет и повторите.";
  if (e && e.code === "42501") return "нет прав. Войдите учётной записью тренера.";
  if (e && e.code === "23505") return "такая запись уже есть.";
  return "сервер не принял данные. Повторите через минуту; если не получится, напишите разработчику.";
}
// X4: кнопка блокируется и показывает ход действия, пока запрос не завершится
async function busy(btn, label, fn) {
  if (!btn || btn.disabled) return;
  const old = btn.textContent; btn.disabled = true; btn.setAttribute("aria-busy", "true"); btn.textContent = label;
  try { return await fn(); } finally { if (btn.isConnected) { btn.disabled = false; btn.removeAttribute("aria-busy"); btn.textContent = old; } }
}
// IX4, IX6: уведомление внизу экрана, одно место и один стиль; с действием «Вернуть» не исчезает 8 секунд
function toast(text, action) {
  let t = document.getElementById("toast");
  if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; t.setAttribute("role", "status"); document.body.append(t); }
  t.innerHTML = ""; const sp = document.createElement("span"); sp.textContent = text; t.append(sp);
  if (action) { const b = document.createElement("button"); b.type = "button"; b.textContent = action.label; b.onclick = () => { t.hidden = true; action.run(); }; t.append(b); }
  t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => { t.hidden = true; }, action ? 8000 : 5000);
}
async function grant(em, note, lib, msgSel, btn) {
  em = em.trim().toLowerCase(); const msg = t => { if (msgSel) $(msgSel).textContent = t; };
  if (!/^[^@\s]+@[^@\s]+$/.test(em)) return msg("Проверьте адрес почты: нужен вид name@mail.ru.");
  await busy(btn, "Открываю…", async () => {
    const { error } = await sb.from("course_access").upsert({ email: em, note: note.trim() || null });
    if (error) return msg("Курс не открыт: " + why(error));
    if (lib) { const r = await sb.from("library_access").upsert({ email: em, note: note.trim() || null }); if (r.error) return msg("Курс открыт, а библиотека нет: " + why(r.error)); }
    await refresh(); toast(`Курс открыт для ${em}.`);
  });
}
async function revoke(em, btn) {
  // обратимое действие: выполняется сразу, в уведомлении 8 секунд можно вернуть доступ с тем же основанием
  const was = USERS.find(x => x.email === em && x.course_access), pend = PENDING.find(x => x.email === em);
  const back = { email: em, note: (was && was.course_note) || (pend && pend.note) || null, granted_at: (was && was.course_granted_at) || (pend && pend.granted_at) || undefined };
  await busy(btn, "Закрываю…", async () => {
    const { error } = await sb.from("course_access").delete().eq("email", em);
    if (error) return toast(`Доступ для ${em} не закрыт: ${why(error)}`);
    await refresh();
    toast(`Курс закрыт для ${em}. Уже выданные ссылки на файлы работают до часа.`, { label: "Вернуть", run: async () => {
      const r = await sb.from("course_access").upsert(back);
      if (r.error) return toast(`Не удалось вернуть доступ: ${why(r.error)}`);
      await refresh(); toast(`Доступ для ${em} возвращён.`);
    } });
  });
}
async function assign() {
  const btn = $("#ap"), row = { profile_id: $("#ap-u").value, program_id: +$("#ap-p").value, start_date: $("#ap-d").value };
  if (!row.profile_id) { $("#ap-msg").textContent = "Назначать некому: никто ещё не входил на сайт."; return; }
  if (!row.start_date) { $("#ap-msg").textContent = "Укажите дату старта."; return; }
  const u = USERS.find(x => x.user_id === row.profile_id), pr = PROGRAMS.find(x => x.id === row.program_id);
  if (u && pr && u.programs.some(x => x.slug === pr.slug && x.status !== "finished")) { $("#ap-msg").textContent = `Программа «${pr.title}» уже назначена этому человеку.`; return; }
  await busy(btn, "Назначаю…", async () => {
    const { error } = await sb.from("client_program").insert(row);
    if (error) { $("#ap-msg").textContent = "Программа не назначена: " + why(error); return; }
    await refresh(); toast(`Программа «${pr ? pr.title : ""}» назначена ${u ? u.email : ""}.`);
  });
}
function denied(e) {
  const forbidden = e.code === "42501" || /forbidden/.test(e.message || "");
  main.innerHTML = `<h1>Кабинет владельца</h1><div class="tile"><h2>${forbidden ? "Нет прав" : "Данные не загрузились"}</h2><p class="note">${forbidden ? `Вы вошли как ${esc(me.email)}. Этот раздел открыт только учётной записи с ролью тренера.` : "Проверьте интернет и обновите страницу. Если ошибка повторяется, возможно, в базе ещё не применена миграция 05."}</p><p class="note">${esc(e.message || "")}</p><div class="row"><a class="btn ghost" href="../app/">Личный кабинет</a></div></div>`;
}
$("#logout").onclick = () => sb.auth.signOut({ scope: "local" }).then(() => location.reload());
(async () => {
  const { data } = await sb.auth.getSession(); me = data.session ? data.session.user : null;

  if (location.hash) history.replaceState(null, "", location.pathname);

  await refresh();
})();
sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_IN" && !me) location.reload(); });

<script>(function(){
  var mq = window.matchMedia ? matchMedia("(prefers-color-scheme: dark)") : null, root = document.documentElement;
  function cur(){ return root.dataset.theme || (mq && mq.matches ? "dark" : "light"); }
  function sync(){ var d = cur() === "dark"; document.querySelectorAll("[data-theme-toggle]").forEach(function(b){ b.setAttribute("aria-pressed", d); }); }
  document.addEventListener("click", function(e){ var b = e.target.closest && e.target.closest("[data-theme-toggle]"); if (!b) return;
    var next = cur() === "dark" ? "light" : "dark"; root.dataset.theme = next; try { localStorage.setItem("bchk-theme", next); } catch (x) {} sync(); });
  if (mq && mq.addEventListener) mq.addEventListener("change", sync);
  new MutationObserver(sync).observe(document.body, { childList: true, subtree: true });
  sync();
})();</script>
